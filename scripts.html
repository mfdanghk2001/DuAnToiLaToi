<script>
document.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();

  const body = document.body;
  const sidebar = document.getElementById('sidebar');
  const collapseBtn = document.getElementById('sidebarCollapse');
  const mobileMenu = document.getElementById('mobileMenu');
  const overlay = document.getElementById('sidebarOverlay');
  const quickCreate = document.getElementById('quickCreate');
  const quickMenu = document.getElementById('quickMenu');
  const notificationBtn = document.getElementById('notificationBtn');
  const notificationPanel = document.getElementById('notificationPanel');
  const closeNotifications = document.getElementById('closeNotifications');
  const todayLabel = document.getElementById('todayLabel');
  const globalSearch = document.getElementById('globalSearch');

  const drawer = document.getElementById('detailDrawer');
  const drawerOverlay = document.getElementById('drawerOverlay');
  const closeDrawerBtn = document.getElementById('closeDrawer');
  const drawerSecondary = document.getElementById('drawerSecondary');
  const drawerEyebrow = document.getElementById('drawerEyebrow');
  const drawerTitle = document.getElementById('drawerTitle');
  const drawerBody = document.getElementById('drawerBody');

  const createModal = document.getElementById('createModal');
  const createModalTitle = document.getElementById('createModalTitle');
  const saveCreateModal = document.getElementById('saveCreateModal');

  const pageNames = {
    dashboard: 'Tổng quan',
    documents: 'Văn bản',
    tasks: 'Nhiệm vụ',
    calendar: 'Lịch công tác',
    meetings: 'Cuộc họp',
    advisory: 'Trợ lý tham mưu',
    reports: 'Báo cáo & thống kê',
    repository: 'Kho tài liệu',
    tools: 'Công cụ hỗ trợ',
    admin: 'Quản trị hệ thống',
    help: 'Trợ giúp'
  };

  const pageIds = ['dashboard','documents','tasks','calendar','meetings','advisory','reports','repository','tools','admin','help'];

  const formatToday = () => {
    if (!todayLabel) return;
    const now = new Date();
    const weekday = new Intl.DateTimeFormat('vi-VN', {weekday:'long'}).format(now);
    const date = new Intl.DateTimeFormat('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric'}).format(now);
    todayLabel.textContent = `${weekday.toUpperCase()} · ${date}`;
  };
  formatToday();

  const showToast = (title, message) => {
    const toast = document.getElementById('toast');
    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastMessage').textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  };

  const closeMobileSidebar = () => {
    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('show');
  };

  const showPage = (page) => {
    document.querySelectorAll('.workspace > .page').forEach(p => p.classList.add('hidden-page'));
    const target = pageIds.includes(page) ? document.getElementById(`page-${page}`) : document.getElementById('page-placeholder');
    target?.classList.remove('hidden-page');

    if (!pageIds.includes(page) && page !== 'dashboard') {
      const t = document.getElementById('placeholderTitle');
      if (t) t.textContent = pageNames[page] || 'Module tiếp theo';
    }
    window.scrollTo({top:0,left:0,behavior:'auto'});
    closeMobileSidebar();
    setTimeout(() => lucide.createIcons(), 20);
  };

  collapseBtn?.addEventListener('click', () => body.classList.toggle('sidebar-collapsed'));
  mobileMenu?.addEventListener('click', () => {sidebar.classList.add('mobile-open');overlay.classList.add('show')});
  overlay?.addEventListener('click', closeMobileSidebar);

  document.querySelectorAll('.nav-item[data-page]').forEach(item => {
    item.addEventListener('click', async e => {
      e.preventDefault();
      document.querySelectorAll('.nav-item[data-page]').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      const page=item.dataset.page;
      showPage(page);

      if (page === 'dashboard' && P1.dashboardDirty) {
        await loadDashboardP1();
      }
      if (page === 'documents') {
        await loadDocumentsD1();
      }
      if (page === 'tasks') {
        await loadTasksD2();
      }
      if (page === 'calendar') {
        await loadCalendarP1();
      }
      if (page === 'meetings') {
        await loadMeetingsP1();
      }
      if (page === 'advisory' && !P1.aiConfigLoaded) {
        P1.aiConfigLoaded=true;
        loadAiConfigC1();
      }
      if (page === 'repository') {
        loadRepositoryB4(B4.repoFolderId || '');
      }
      if (page === 'reports') {
        loadReportB4();
      }
      if (page === 'admin') {
        loadAdminB5();
      }

  });

  document.getElementById('backDashboard')?.addEventListener('click', () => {
    document.querySelector('.nav-item[data-page="dashboard"]')?.click();
  });

  quickCreate?.addEventListener('click', e => {
    e.stopPropagation();
    quickMenu.classList.toggle('show');
    notificationPanel.classList.remove('show');
  });

  notificationBtn?.addEventListener('click', async e => {
    e.stopPropagation();
    const opening=!notificationPanel.classList.contains('show');
    notificationPanel.classList.toggle('show');
    quickMenu.classList.remove('show');
    if(opening) await loadNotificationsB6();

  closeNotifications?.addEventListener('click', () => notificationPanel.classList.remove('show'));

  document.addEventListener('click', e => {
    if (quickMenu && !quickMenu.contains(e.target) && !quickCreate.contains(e.target)) quickMenu.classList.remove('show');

  document.querySelectorAll('.module-tabs').forEach(tabs => {
    tabs.querySelectorAll('.module-tab').forEach(tab => {

        tabs.querySelectorAll('.module-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });

      document.getElementById('taskKanbanView')?.classList.toggle('hidden-block', !isKanban);

    input.addEventListener('input', () => {
      const q = input.value.toLowerCase().trim();
      document.querySelectorAll(selector).forEach(row => {

        <div class="timeline-item"><time>09:30</time><span class="timeline-dot"></span><p><strong>Văn thư tiếp nhận</strong><br>Đã nhập văn bản vào hệ thống.</p></div>

      </div>
      <div class="detail-section">
        <div class="detail-section-head"><h4>Tài liệu công việc</h4><button class="text-btn demo-action">Thêm tài liệu</button></div>
        <div class="file-chip"><i data-lucide="file-text"></i><div><strong>Du-thao-bao-cao-v3.docx</strong><small>DOCX · Cập nhật 12:15</small></div><button class="icon-btn demo-action"><i data-lucide="eye"></i></button></div>
      </div>
      <div class="detail-section">

        <div class="timeline-item"><time>09:20</time><span class="timeline-dot"></span><p><strong>Văn phòng</strong><br>Bổ sung số liệu mục 2.3 theo báo cáo mới.</p></div>

    meeting: `
      <div class="detail-summary">

        <div class="timeline-item"><time>01</time><span class="timeline-dot"></span><p>Đánh giá kết quả thực hiện nhiệm vụ tháng 9.</p></div>
        <div class="timeline-item"><time>02</time><span class="timeline-dot"></span><p>Thảo luận nhiệm vụ trọng tâm tháng 10.</p></div>
        <div class="timeline-item"><time>03</time><span class="timeline-dot"></span><p>Xem xét các nội dung thuộc thẩm quyền.</p></div>
      </div>`
  };

  const openDrawer = (type) => {
    const labels = {document:['HỒ SƠ VĂN BẢN','Chi tiết văn bản'],task:['NHIỆM VỤ','Chi tiết nhiệm vụ'],meeting:['CUỘC HỌP','Hồ sơ cuộc họp']};
    drawerEyebrow.textContent = labels[type][0];
    drawerTitle.textContent = labels[type][1];
    drawerBody.innerHTML = drawerTemplates[type];
    drawer.classList.add('show');
    drawerOverlay.classList.add('show');
    lucide.createIcons();
  };
  const closeDrawer = () => {drawer.classList.remove('show');drawerOverlay.classList.remove('show')};
  closeDrawerBtn?.addEventListener('click', closeDrawer);
  drawerSecondary?.addEventListener('click', closeDrawer);
  drawerOverlay?.addEventListener('click', closeDrawer);
  document.querySelectorAll('.document-detail-trigger').forEach(el => el.addEventListener('click', e => {if (!e.target.closest('button')) openDrawer('document')}));
  document.querySelectorAll('.task-detail-trigger').forEach(el => el.addEventListener('click', e => {if (!e.target.closest('button')) openDrawer('task')}));
  document.querySelectorAll('.meeting-detail-trigger').forEach(el => el.addEventListener('click', e => {if (!e.target.closest('button')) openDrawer('meeting')}));


  const createForm = document.getElementById('createForm');

  const modalForms = {
    document: `
      <label class="form-field form-span-2"><span>Trích yếu văn bản <b>*</b></span><input type="text" placeholder="Nhập trích yếu..."></label>
      <label class="form-field"><span>Số / ký hiệu</span><input type="text" placeholder="VD: 124-CV/ĐU"></label>
      <label class="form-field"><span>Loại văn bản</span><select><option>Văn bản đến</option><option>Văn bản đi</option><option>Dự thảo</option></select></label>
      <label class="form-field"><span>Cơ quan ban hành</span><input type="text" placeholder="Nhập cơ quan ban hành"></label>
      <label class="form-field"><span>Ngày nhận</span><input type="date" value="2026-09-17"></label>
      <label class="form-field"><span>Người xử lý</span><select><option>Nguyễn Thị A</option><option>Văn phòng</option><option>Trần Văn B</option></select></label>
      <label class="form-field"><span>Hạn xử lý</span><input type="date" value="2026-09-20"></label>
      <label class="form-field form-span-2"><span>Ghi chú</span><textarea rows="3" placeholder="Nhập thông tin bổ sung..."></textarea></label>
      <label class="upload-zone form-span-2"><input type="file"><i data-lucide="cloud-upload"></i><strong>Thả file vào đây hoặc bấm để chọn</strong><span>PDF, DOCX, XLSX · tối đa 20 MB</span></label>`,
    task: `
      <label class="form-field form-span-2"><span>Tên nhiệm vụ <b>*</b></span><input type="text" placeholder="Nhập nhiệm vụ cần giao..."></label>
      <label class="form-field"><span>Người chủ trì</span><select><option>Nguyễn Thị A</option><option>Nguyễn Văn A</option><option>Trần Văn B</option></select></label>
      <label class="form-field"><span>Người phối hợp</span><select><option>Văn phòng</option><option>Bộ phận chuyên môn</option><option>Không có</option></select></label>
      <label class="form-field"><span>Mức độ ưu tiên</span><select><option>Bình thường</option><option>Cao</option><option>Khẩn</option></select></label>
      <label class="form-field"><span>Hạn hoàn thành</span><input type="datetime-local" value="2026-09-20T16:30"></label>
      <label class="form-field form-span-2"><span>Nội dung / yêu cầu</span><textarea rows="4" placeholder="Mô tả kết quả cần hoàn thành..."></textarea></label>
      <label class="upload-zone form-span-2"><input type="file"><i data-lucide="paperclip"></i><strong>Đính kèm tài liệu giao việc</strong><span>PDF, DOCX, XLSX · tối đa 20 MB</span></label>`,
    meeting: `
      <label class="form-field form-span-2"><span>Tên cuộc họp <b>*</b></span><input type="text" placeholder="VD: Họp Ban Thường vụ tháng 9/2026"></label>
      <label class="form-field"><span>Ngày họp</span><input type="date" value="2026-09-17"></label>
      <label class="form-field"><span>Thời gian</span><input type="time" value="14:00"></label>
      <label class="form-field"><span>Chủ trì</span><input type="text" placeholder="Bí thư Đảng ủy"></label>

    calendar: `
      <label class="form-field form-span-2"><span>Tên lịch công tác <b>*</b></span><input type="text" placeholder="VD: Làm việc với bộ phận chuyên môn"></label>
      <label class="form-field"><span>Ngày</span><input type="date" value="2026-09-17"></label>

      <label class="form-field"><span>Nhóm lịch</span><select><option>Lịch chung</option><option>Bí thư</option><option>Phó Bí thư</option><option>Văn phòng</option></select></label>

  const openModal = type => {
    if (type === 'document' && typeof openDocumentModalD1 === 'function') {
      openDocumentModalD1();
      return;
    }
    if (type === 'task' && typeof openTaskModalD2 === 'function') {
      openTaskModalD2();
      return;
    }
    if (type === 'calendar' && typeof openCalendarModalF1 === 'function') {
      openCalendarModalF1();
      return;
    }
    if (type === 'meeting' && typeof openMeetingModalF1 === 'function') {
      openMeetingModalF1();
      return;
    }
    currentCreateType = type;
    createModalTitle.textContent = createTitles[type] || 'Tạo mới';
    if (createForm && modalForms[type]) createForm.innerHTML = modalForms[type];
    if (type === 'task' && createForm && B2.users?.length) {
      const sel = createForm.querySelector('select');
      if (sel) sel.innerHTML = B2.users.map(u => `<option>${esc(u.full_name || u.email)}</option>`).join('');

    createModal.classList.add('show');
    lucide.createIcons();
  };
  const closeModal = () => {
    createModal.classList.remove('show');
  };
  document.querySelectorAll('.open-create-modal').forEach(btn => btn.addEventListener('click', () => openModal(btn.dataset.type)));

  createModal?.addEventListener('click', e => {if (e.target === createModal) closeModal()});
  saveCreateModal?.addEventListener('click', async () => {

  // Quick menu actions to real modal/page.
  const quickButtons = quickMenu?.querySelectorAll('button') || [];
  quickButtons.forEach((btn, i) => {
    btn.addEventListener('click', () => {
      quickMenu.classList.remove('show');
      if (i === 0) openModal('document');
      else if (i === 1) openModal('task');
      else if (i === 2) openModal('meeting');
      else if (i === 3) openModal('calendar');
      else if (i === 4) document.querySelector('.nav-item[data-page="advisory"]')?.click();
      else if (i === 5) {
        document.querySelector('.nav-item[data-page="repository"]')?.click();
        setTimeout(()=>document.getElementById('repoUploadInput')?.click(),120);
      }
    });
  });

  document.getElementById('btnViewCalendar')?.addEventListener('click', () => document.querySelector('.nav-item[data-page="calendar"]')?.click());
  document.getElementById('btnNewDocument')?.addEventListener('click', () => openModal('document'));

  document.getElementById('dashboardOpenCalendar')?.addEventListener('click',()=>document.querySelector('.nav-item[data-page="calendar"]')?.click());
  document.querySelectorAll('[data-dashboard-tool]').forEach(btn=>btn.addEventListener('click',()=>{
    const type=btn.dataset.dashboardTool;

    }

  function busyLabelP3_(fn){
    if(/Upload|Add.*File|Export/i.test(fn)) return 'Đang tải tệp và xử lý dữ liệu…';
    if(/Create|Update|Save|Archive|Cancel|Approve|Reopen|Trash|Rename|Favorite|Mark|Install|Backup|Link|Run/i.test(fn)) return 'Đang lưu thay đổi…';
    if(/Search/i.test(fn)) return 'Đang tìm kiếm…';

  function beginBusyP3_(fn){
    P3.activeRequests++;
    if(P3.activeRequests!==1) return;
    clearTimeout(P3.busyTimer);
    P3.busyTimer=setTimeout(()=>{
      const el=ensureGlobalBusyP3_();

  function endBusyP3_(ok=true){
    P3.activeRequests=Math.max(0,P3.activeRequests-1);
    if(P3.activeRequests>0) return;
    clearTimeout(P3.busyTimer);
    const el=P3.busyEl;
    if(!el) return;
    if(!el.classList.contains('show')) return;
    el.classList.toggle('success',ok);
    el.classList.toggle('error',!ok);
    const label=el.querySelector('.global-busy-text');
    if(label) label.textContent=ok?'Đã hoàn tất':'Có lỗi khi xử lý';
    setTimeout(()=>{
      if(P3.activeRequests===0){
        el.className='global-busy';
      }
    },ok?360:900);
  }

  function cacheKeyP3_(fn,args){
    let payload='';
    try{ payload=JSON.stringify(args||[]); }catch(e){ payload=String(args||''); }
    return fn+'|'+payload;
  }

  function isMutationP3_(fn){
    return /Create|Update|Save|Add|Archive|Cancel|Approve|Reopen|Trash|Rename|Favorite|Upload|Install|Backup|Mark|Run|Link|Reset|Change/i.test(fn);
  }

  const authDirectCall = (fn, ...args) => new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) {
      reject(new Error('Không tìm thấy môi trường Google Apps Script.'));
      return;
    }
    beginBusyP3_(fn);
    let runner = google.script.run
      .withSuccessHandler(result=>{endBusyP3_(true);resolve(result)})
      .withFailureHandler(err=>{endBusyP3_(false);reject(new Error(err?.message || String(err)))});
    runner[fn](...args);
  });

  const gasCall = (fn, ...args) => {
    if (!window.google || !google.script || !google.script.run) {
      return Promise.reject(new Error('Không tìm thấy môi trường Google Apps Script.'));
    }

    const ttl=P3_READ_TTL[fn]||0;
    const key=ttl?cacheKeyP3_(fn,args):'';

    if(ttl){
      const cached=P3.readCache.get(key);
      if(cached && (Date.now()-cached.at)<ttl){
        return Promise.resolve(cached.data);
      }
      if(P3.inflight.has(key)) return P3.inflight.get(key);
    }

    const token=sessionStorage.getItem(SESSION_KEY)||'';
    beginBusyP3_(fn);

    const request=new Promise((resolve,reject)=>{
      google.script.run
        .withSuccessHandler(result=>{
          if(ttl) P3.readCache.set(key,{at:Date.now(),data:result});
          if(isMutationP3_(fn)) clearReadCacheP3_();
          endBusyP3_(true);
          resolve(result);
        })
        .withFailureHandler(err=>{
          const message=err?.message||String(err);
          endBusyP3_(false);
          if(/Phiên đăng nhập|SESSION_EXPIRED/i.test(message)){
            sessionStorage.removeItem(SESSION_KEY);
            setTimeout(()=>showLoginGateway_('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.'),0);
          }
          reject(new Error(message));
        })
        .apiDispatch(fn,args,token);
    });

    if(ttl){
      P3.inflight.set(key,request);
      request.then(
        ()=>P3.inflight.delete(key),
        ()=>P3.inflight.delete(key)
      );
    }
    return request;
  };

  async function startP2Prefetch_(){
    if(P2.prefetchPromise) return P2.prefetchPromise;

    P2.prefetchPromise=gasCall('apiP2Prefetch')
      .then(data=>{
        if(!data?.ok) return data;

        if(data.documents && JSON.stringify(D1.filters)===defaultD1Key_()){
          D1.list=data.documents;
          D1.filters.page=data.documents.pagination?.page||1;
          D1.loadedAt=Date.now();
          D1.loadedKey=defaultD1Key_();
        }

        if(data.tasks && JSON.stringify(D2.filters)===defaultD2Key_()){
          D2.list=data.tasks;
          D2.filters.page=data.tasks.pagination?.page||1;
          D2.loadedAt=Date.now();
          D2.loadedKey=defaultD2Key_();
        }

        if(data.calendar?.items){
          B2.calendarEvents=data.calendar.items;
          P1.calendarLoaded=true;
        }

        if(data.meetings?.items){
          B2.meetings=data.meetings.items;
          P1.meetingsLoaded=true;
        }

        if(data.todayCalendar?.items){
          loadDashboardAgendaF1(data.todayCalendar.items);
        }

        P2.prefetched=true;
        return data;
      })
      .catch(()=>null)
      .finally(()=>{ P2.prefetchPromise=null; });

    return P2.prefetchPromise;
  }

    r.onerror=()=>reject(new Error('Không đọc được file đính kèm.'));

  async function saveB2Create(type) {
    if (!type) return;
    if (!['document','task','calendar','meeting'].includes(type)) {
      closeModal();

    try {

        const inputs=[...createForm.querySelectorAll('input,select,textarea')].filter(x=>x.type!=='file');
        const values=inputs.map(x=>x.value);
        const title=values[0]||'';
        if (!title.trim()) throw new Error('Bạn chưa nhập tên nhiệm vụ.');
        const ownerName=values[1]||'';
        const owner=B2.users.find(u=>(u.full_name||u.email)===ownerName);
        const priorityMap={'Bình thường':'NORMAL','Cao':'HIGH','Khẩn':'URGENT'};

        await gasCall('apiD2CreateTask',{
          title,
          owner_user_id:owner?.user_id||B2.user?.userId||'',
          collaborator_ids:'',
          priority:priorityMap[values[3]]||'NORMAL',
          due_date:values[4]||'',
          description:values[5]||'',
          source_type:window.D1DocumentTaskSource ? 'DOCUMENT' : (window.C2DraftTaskSource ? 'DRAFT' : (window.B3MeetingTaskSource ? 'MEETING' : '')),
          source_id:window.D1DocumentTaskSource || window.C2DraftTaskSource || window.B3MeetingTaskSource || ''
        });

        window.B3MeetingTaskSource='';
        window.C2DraftTaskSource='';
        window.D1DocumentTaskSource='';
      } else if (type==='calendar') {
        const inputs=[...createForm.querySelectorAll('input,select,textarea')].filter(x=>x.type!=='file');
        const values=inputs.map(x=>x.value);
        const title=values[0]||'';
        if(!title.trim()) throw new Error('Bạn chưa nhập tên lịch công tác.');

        const groupMap={
          'Lịch chung':'GENERAL',
          'Bí thư':'SECRETARY',
          'Phó Bí thư':'DEPUTY_SECRETARY',
          'Văn phòng':'OFFICE'
        };

        await gasCall('apiCreateCalendarEvent',{
          title,
          event_date:values[1]||'',
          start_time:values[2]||'',
          end_time:values[3]||'',
          calendar_group:groupMap[values[4]]||'GENERAL',
          location:values[5]||'',
          description:values[6]||''
        });
      } else if (type==='meeting') {
        const inputs=[...createForm.querySelectorAll('input,select,textarea')].filter(x=>x.type!=='file');
        const values=inputs.map(x=>x.value);
        const fileInput=createForm.querySelector('input[type="file"]');
        const attachment=await readFileAsBase64(fileInput?.files?.[0]||null);
        const title=values[0]||'';
        if(!title.trim()) throw new Error('Bạn chưa nhập tên cuộc họp.');

        await gasCall('apiCreateMeeting',{
          title,
          meeting_date:values[1]||'',
          start_time:values[2]||'',
          chairperson:values[3]||'',
          location:values[4]||'',
          agenda:values[5]||'',
          meeting_type:'Khác',
          attachment
        });
      }
      closeModal();
      await refreshB2();
      const successMessage={
        document:'Văn bản đã được lưu vào Google Sheets/Drive.',
        task:'Nhiệm vụ đã được lưu vào Google Sheets.',
        calendar:'Lịch công tác đã được lưu vào Google Sheets.',
        meeting:'Cuộc họp đã được lưu và tự động thêm vào lịch công tác.'
      }[type] || 'Dữ liệu đã được lưu.';

      showToast('Không thể lưu', err.message||String(err));
    } finally { setSaving(false); }
  }


  // =========================
  // B3 - Calendar + Meetings
  // =========================
  let calendarAnchor = new Date(2026, 8, 17);
  let meetingFilter = 'upcoming';

  const startOfWeek = date => {
    const d=new Date(date);
    const day=(d.getDay()+6)%7;
    d.setHours(0,0,0,0);
    d.setDate(d.getDate()-day);
    return d;
  };

  const addDays = (date,n) => {
    const d=new Date(date);
    d.setDate(d.getDate()+n);
    return d;
  };

  const dateKeyLocal = d =>
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  const isoWeekNumber = d => {
    const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    const dayNum=x.getUTCDay()||7;
    x.setUTCDate(x.getUTCDate()+4-dayNum);
    const yearStart=new Date(Date.UTC(x.getUTCFullYear(),0,1));
    return Math.ceil((((x-yearStart)/86400000)+1)/7);
  };

  const timeToMinutes = t => {
    const m=String(t||'').match(/^(\d{1,2}):(\d{2})/);
    return m ? Number(m[1])*60+Number(m[2]) : 7*60;
  };

  const eventClassByGroup = group => ({
    GENERAL:'red-event',
    SECRETARY:'blue-event',
    DEPUTY_SECRETARY:'green-event',
    OFFICE:'purple-event'
  }[group] || 'blue-event');

  const enabledCalendarGroups = () =>
    [...document.querySelectorAll('[data-calendar-group]')]
      .filter(x=>x.checked)
      .map(x=>x.dataset.calendarGroup);

  function renderCalendarB3() {
    const header=document.getElementById('calendarWeekHeader');
    const body=document.getElementById('calendarWeekBody');
    if(!header||!body) return;

    const monday=startOfWeek(calendarAnchor);
    const sunday=addDays(monday,6);
    const weekdays=['T2','T3','T4','T5','T6','T7','CN'];

    const title=document.getElementById('calendarRangeTitle');
    if(title) {
      const sameMonth=monday.getMonth()===sunday.getMonth();
      title.textContent=sameMonth
        ? `${monday.getDate()} – ${sunday.getDate()} tháng ${monday.getMonth()+1}, ${monday.getFullYear()}`
        : `${monday.getDate()}/${monday.getMonth()+1} – ${sunday.getDate()}/${sunday.getMonth()+1}/${sunday.getFullYear()}`;
    }
    const wk=document.getElementById('calendarWeekNumber');
    if(wk) wk.textContent=`Tuần ${isoWeekNumber(monday)}`;

    const todayKey=dateKeyLocal(new Date());

    header.innerHTML=`<div class="time-head"></div>`+
      weekdays.map((w,i)=>{
        const d=addDays(monday,i);
        return `<div class="${dateKeyLocal(d)===todayKey?'today-col':''}">
          <span>${w}</span><strong>${d.getDate()}</strong>
        </div>`;
      }).join('');

    const enabled=enabledCalendarGroups();
    const weekEvents=(B2.calendarEvents||[]).filter(e=>{
      if(!enabled.includes(e.calendar_group||'GENERAL')) return false;
      const k=String(e.event_date||'').slice(0,10);
      return k>=dateKeyLocal(monday)&&k<=dateKeyLocal(sunday);
    });

    const times=Array.from({length:11},(_,i)=>`${String(i+7).padStart(2,'0')}:00`);
    let bodyHtml=`<div class="time-column">${times.map(t=>`<span>${t}</span>`).join('')}</div>`;

    for(let i=0;i<7;i++){
      const day=addDays(monday,i);
      const k=dateKeyLocal(day);
      const events=weekEvents.filter(e=>String(e.event_date||'').slice(0,10)===k);

      let col=`<div class="day-column ${k===todayKey?'today-column-bg':''}">`;
      if(k===todayKey){
        const now=new Date();
        const min=now.getHours()*60+now.getMinutes();
        if(min>=7*60&&min<=18*60){
          const top=(min-7*60)/60*50;
          col+=`<div class="current-time-line" style="top:${top}px"><span></span></div>`;
        }
      }

      events.forEach(e=>{
        const start=timeToMinutes(e.start_time);
        const end=e.end_time ? timeToMinutes(e.end_time) : start+60;
        const top=Math.max(0,(start-7*60)/60*50);
        const height=Math.max(38,(end-start)/60*50);
        col+=`<div class="cal-event ${eventClassByGroup(e.calendar_group)} b3-event-detail"
          data-id="${esc(e.event_id)}" style="top:${top}px;height:${height}px">
          <strong>${esc(e.title)}</strong>
          <span>${esc(e.start_time||'')} ${e.location?'· '+esc(e.location):''}</span>
        </div>`;
      });

      col+=`</div>`;
      bodyHtml+=col;
    }

    body.innerHTML=bodyHtml;
    lucide.createIcons();
  }

  const meetingDateTime = m => {
    const raw=`${String(m.meeting_date||'').slice(0,10)}T${m.start_time||'00:00'}`;
    const d=new Date(raw);
    return isNaN(d)?new Date(0):d;
  };

  const meetingStatusLabel = m => {
    const dt=meetingDateTime(m);
    const now=new Date();
    if(m.status==='COMPLETED') return ['Đã hoàn thành','status-success'];
    if(dt<now) return ['Đã diễn ra','status-new'];

    const today=dateKeyLocal(now);
    if(String(m.meeting_date||'').slice(0,10)===today) return ['Hôm nay · '+(m.start_time||''),'status-warning'];
    return [m.start_time||'Sắp diễn ra','status-new'];
  };

  function taskUsersD2(){

  function pendingTaskSourceD2(){
    if(window.D1DocumentTaskSource) return {type:'DOCUMENT',id:window.D1DocumentTaskSource};
    if(window.B3MeetingTaskSource) return {type:'MEETING',id:window.B3MeetingTaskSource};
    if(window.C2DraftTaskSource) return {type:'DRAFT',id:window.C2DraftTaskSource};

  function clearPendingTaskSourceD2(){
    window.D1DocumentTaskSource='';
    window.B3MeetingTaskSource='';
    window.C2DraftTaskSource='';
    D2.pendingSource={type:'',id:''};

  function sourcePreviewD2(source){
    if(!source?.type || !source.id) return '';
    let title='';
    if(source.type==='DOCUMENT'){
      const d=(B2.documents||[]).find(x=>x.document_id===source.id) || D1.current?.document;
      title=d ? [d.document_no,d.title].filter(Boolean).join(' · ') : source.id;
    }else if(source.type==='MEETING'){
      const m=(B2.meetings||[]).find(x=>x.meeting_id===source.id);
      title=m?.title || source.id;
    }else if(source.type==='DRAFT'){
      const out=Object.values(C2.outputs||{}).find(x=>x.draftId===source.id);
      title=out ? draftTitleC2(out) : source.id;
    }
    return `<div class="d2-source-card"><i data-lucide="link-2"></i><div><strong>${esc(taskSourceLabelD2(source.type))}</strong><span>${esc(title)}</span></div></div>`;
  }

  function sourcePrefillD2(source){
    if(source.type==='DOCUMENT'){
      const d=(B2.documents||[]).find(x=>x.document_id===source.id) || D1.current?.document;
      if(d) return {
        title:`Xử lý văn bản ${d.document_no||''}: ${d.title||''}`.slice(0,180),
        description:[d.summary,d.notes].filter(Boolean).join('\n\n'),
        priority:d.priority||'NORMAL',
        due_date:d.due_date||'',
        owner_user_id:d.assignee_user_id||''
      };
    }
    if(source.type==='MEETING'){
      const m=(B2.meetings||[]).find(x=>x.meeting_id===source.id);
      if(m) return {
        title:`Thực hiện kết luận: ${m.title||''}`.slice(0,180),
        description:m.agenda||'',
        priority:'NORMAL',
        due_date:'',
        owner_user_id:''
      };
    }
    if(source.type==='DRAFT'){
      const out=Object.values(C2.outputs||{}).find(x=>x.draftId===source.id);
      if(out) return {
        title:`Thực hiện kết luận: ${draftTitleC2(out)}`.slice(0,180),
        description:out.text||'',
        priority:'NORMAL',
        due_date:'',
        owner_user_id:''
      };
    }
    return {};
  }

  function formatTaskDueD2(value){
    if(!value) return 'Chưa đặt hạn';
    const d=new Date(value);
    if(isNaN(d)) return formatDateTimeVN(value);
    const now=new Date();
    if(d<now) return 'Quá hạn · '+formatDateTimeVN(value);
    return formatDateTimeVN(value);
  }

    box.innerHTML=`
      <button ${p.page<=1?'disabled':''} data-page="${p.page-1}"><i data-lucide="chevron-left"></i></button>
      ${pages.map(n=>`<button class="${n===p.page?'active':''}" data-page="${n}">${n}</button>`).join('')}
      <button ${p.page>=p.pages?'disabled':''} data-page="${p.page+1}"><i data-lucide="chevron-right"></i></button>`;
  }

  async function loadTasksD2(resetPage=false){
    const box=document.getElementById('taskFullList');
    if(!box) return;
    if(resetPage) D2.filters.page=1;

    const requestKey=JSON.stringify(D2.filters);
    if(
      D2.list &&
      D2.loadedKey===requestKey &&
      (Date.now()-D2.loadedAt)<P1.cacheMs
    ){
      renderTasksD2();
      return;
    }

    box.innerHTML='<div class="admin-loading"><span class="backend-spinner"></span><span>Đang tải nhiệm vụ...</span></div>';
    try{
      if(requestKey===defaultD2Key_() && P2.prefetchPromise){
        await P2.prefetchPromise;
        if(D2.list && D2.loadedKey===defaultD2Key_()){
          renderTasksD2();
          return;
        }
      }

      D2.list=await gasCall('apiD2ListTasks',D2.filters);
      D2.filters.page=D2.list.pagination.page;
      D2.loadedAt=Date.now();
      D2.loadedKey=JSON.stringify(D2.filters);
      renderTasksD2();
    }catch(err){
      box.innerHTML=`<div class="empty-data"><i data-lucide="circle-alert"></i><strong>Không tải được nhiệm vụ</strong><span>${esc(err.message||String(err))}</span></div>`;
      lucide.createIcons();
    }
  }

  function validateTaskFilesD2(files){
    const arr=[...files];
    if(arr.length>5) throw new Error('Mỗi lần chỉ chọn tối đa 5 tệp.');
    const tooLarge=arr.find(f=>f.size>20*1024*1024);
    if(tooLarge) throw new Error(`${tooLarge.name} vượt quá 20 MB.`);
    return arr;
  }

  async function uploadTaskFilesD2(taskId,files){
    for(let i=0;i<files.length;i++){
      const f=files[i];
      showToast('Đang tải tài liệu',`${i+1}/${files.length} · ${f.name}`);
      const encoded=await readFileAsBase64(f);
      encoded.size=f.size;
      await gasCall('apiD2AddTaskFile',taskId,encoded);
    }
  }

      ? {type:task.source_type||'',id:task.source_id||''}
      : pendingTaskSourceD2();

    const prefill=task || sourcePrefillD2(D2.pendingSource);
    const modal=document.getElementById('d2TaskModal');
    if(!modal) return;

    document.getElementById('d2TaskModalTitle').textContent=task?'Cập nhật nhiệm vụ':'Giao nhiệm vụ';
    document.getElementById('d2TaskTitle').value=prefill.title||'';
    document.getElementById('d2TaskPriority').value=prefill.priority||'NORMAL';
    document.getElementById('d2TaskStartDate').value=formatInputDateD1(prefill.start_date||new Date());
    document.getElementById('d2TaskDueDate').value=formatInputDateTimeD1(prefill.due_date);
    document.getElementById('d2TaskDescription').value=prefill.description||'';

    const owner=document.getElementById('d2TaskOwner');
    owner.innerHTML=taskUsersD2().map(u=>`<option value="${esc(u.user_id)}">${esc(u.full_name||u.email)}</option>`).join('');
    owner.value=prefill.owner_user_id||B2.user?.userId||taskUsersD2()[0]?.user_id||'';

    renderCollaboratorsD2(task?.collaborator_ids||[],owner.value);
    document.getElementById('d2TaskSourcePreview').innerHTML=sourcePreviewD2(D2.pendingSource);
    document.getElementById('d2TaskFiles').value='';
    renderSelectedTaskFilesD2();

    modal.classList.add('show');
    lucide.createIcons();
  }

  function closeTaskModalD2(){
    document.getElementById('d2TaskModal')?.classList.remove('show');

    D2.selectedFiles=[];
    if(!D2.current) clearPendingTaskSourceD2();

  async function saveTaskD2(){
    const title=document.getElementById('d2TaskTitle')?.value.trim()||'';
    if(!title){showToast('Thiếu thông tin','Bạn chưa nhập tên nhiệm vụ.');return;}

    const collaborators=[...document.querySelectorAll('#d2TaskCollaborators input:checked')].map(x=>x.value);
    const payload={
      title,
      owner_user_id:document.getElementById('d2TaskOwner')?.value||'',
      collaborator_ids:collaborators,
      priority:document.getElementById('d2TaskPriority')?.value||'NORMAL',
      start_date:document.getElementById('d2TaskStartDate')?.value||'',
      due_date:document.getElementById('d2TaskDueDate')?.value||'',
      description:document.getElementById('d2TaskDescription')?.value||'',
      source_type:D2.pendingSource.type||'',
      source_id:D2.pendingSource.id||''
    };

    const btn=document.getElementById('d2SaveTask');
    const modal=document.getElementById('d2TaskModal');
    const editingIdBefore=D2.editingId;
    btn.disabled=true;
    btn.innerHTML='<span class="backend-spinner"></span> Đang lưu...';

    // Phản hồi UI ngay; ghi Sheets/Drive tiếp tục đồng bộ nền.
    modal?.classList.remove('show');
    showSyncP2_(editingIdBefore?'Đang cập nhật nhiệm vụ…':'Đang lưu nhiệm vụ…');

    try{
      const result=editingIdBefore
        ? await gasCall('apiD2UpdateTask',editingIdBefore,payload)
        : await gasCall('apiD2CreateTask',payload);
      const taskId=result.task.task_id;

      if(D2.selectedFiles.length) await uploadTaskFilesD2(taskId,D2.selectedFiles);

      const wasEditing=Boolean(editingIdBefore);
      const uploadedCount=D2.selectedFiles.length;
      clearPendingTaskSourceD2();
      invalidateTasksP1();

      showToast('Đã lưu nhiệm vụ',uploadedCount
        ? `Đã lưu nhiệm vụ và ${uploadedCount} tài liệu.`
        : 'Thông tin nhiệm vụ đã được cập nhật.');
      showSyncP2_('Nhiệm vụ đã đồng bộ','success',1400);

      // Làm mới nền, không bắt người dùng chờ thêm một vòng đọc Sheets.
      loadTasksD2();
      if(wasEditing) setTimeout(()=>openTaskD2(taskId),30);
      D2.editingId='';
      D2.selectedFiles=[];
    }catch(err){
      modal?.classList.add('show');
      showSyncP2_('Đồng bộ thất bại','error',2200);
      showToast('Không thể lưu nhiệm vụ',err.message||String(err));
    }finally{
      btn.disabled=false;
      btn.innerHTML='<i data-lucide="save"></i> Lưu nhiệm vụ';
      lucide.createIcons();
    }
  }

  function taskHistoryDescriptionD2(h){
    if(h.action==='COMMENT') return h.note||'Ghi chú';
    if(h.action==='ADD_FILE') return h.note||'Thêm tài liệu';
    const bits=[];
    if(h.from_status!==h.to_status && h.to_status) bits.push(`${taskStatusLabelD2(h.from_status)} → ${taskStatusLabelD2(h.to_status)}`);
    if(String(h.from_progress)!==String(h.to_progress) && h.to_progress!=='') bits.push(`${h.from_progress||0}% → ${h.to_progress}%`);
    if(h.note) bits.push(h.note);
    return bits.join(' · ')||'Cập nhật nhiệm vụ.';
  }

  const documentStatusOptionsD1 = [
    ['NEW','Mới tiếp nhận'],
    ['PROCESSING','Đang xử lý'],
    ['WAITING_APPROVAL','Chờ duyệt'],
    ['COMPLETED','Hoàn thành'],
    ['ARCHIVED','Lưu trữ']
  ];

  const historyActionLabelD1 = action => ({
    CREATE:'Tiếp nhận văn bản',
    UPDATE_INFO:'Cập nhật thông tin',
    UPDATE_PROCESSING:'Cập nhật xử lý',
    ADD_FILE:'Thêm tài liệu',
    NOTE:'Ghi chú xử lý',
    ARCHIVE:'Lưu trữ hồ sơ',
    CREATE_TASK:'Tạo nhiệm vụ'
  }[action] || action || 'Cập nhật');

  const priorityLabelD1 = p => ({
    NORMAL:'Bình thường',
    HIGH:'Cao',
    URGENT:'Khẩn'
  }[p] || p || 'Bình thường');

  const formatInputDateD1 = value => {
    if(!value) return '';
    const d=new Date(value);
    if(isNaN(d)) return String(value).slice(0,10);
    const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  };

  const formatInputDateTimeD1 = value => {
    if(!value) return '';
    const d=new Date(value);
    if(isNaN(d)) return String(value).slice(0,16);
    const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
    const hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');
    return `${y}-${m}-${day}T${hh}:${mm}`;
  };

  function populateSelectD1(id,items,currentValue,allLabel){
    const el=document.getElementById(id);
    if(!el) return;
    const current=currentValue ?? el.value;
    el.innerHTML=(allLabel!==undefined?`<option value="ALL">${esc(allLabel)}</option>`:'')+
      items.map(i=>`<option value="${esc(i.value)}">${esc(i.label)}</option>`).join('');
    if([...el.options].some(o=>o.value===current)) el.value=current;
  }

  async function loadDocumentsD1(resetPage=false){
    const body=document.getElementById('documentTableBody');
    if(!body) return;
    if(resetPage) D1.filters.page=1;

    const requestKey=JSON.stringify(D1.filters);
    if(
      D1.list &&
      D1.loadedKey===requestKey &&
      (Date.now()-D1.loadedAt)<P1.cacheMs
    ){
      renderDocumentsD1();
      return;
    }

    body.innerHTML=`<tr><td colspan="7"><div class="admin-loading"><span class="backend-spinner"></span><span>Đang tải hồ sơ văn bản...</span></div></td></tr>`;

    try{
      if(requestKey===defaultD1Key_() && P2.prefetchPromise){
        await P2.prefetchPromise;
        if(D1.list && D1.loadedKey===defaultD1Key_()){
          renderDocumentsD1();
          return;
        }
      }

      const data=await gasCall('apiD1ListDocuments',D1.filters);
      D1.list=data;
      D1.filters.page=data.pagination.page;
      D1.loadedAt=Date.now();
      D1.loadedKey=JSON.stringify(D1.filters);
      renderDocumentsD1();
    }catch(err){
      body.innerHTML=`<tr><td colspan="7"><div class="empty-data"><i data-lucide="circle-alert"></i><strong>Không tải được văn bản</strong><span>${esc(err.message||String(err))}</span></div></td></tr>`;
      lucide.createIcons();
    }
  }

  function renderDocumentPaginationD1(p){
    const box=document.getElementById('documentPagination');

    box.innerHTML=`
      <button ${p.page<=1?'disabled':''} data-page="${p.page-1}"><i data-lucide="chevron-left"></i></button>
      ${pages.map(n=>`<button class="${n===p.page?'active':''}" data-page="${n}">${n}</button>`).join('')}

  function validateFilesD1(files){
    const arr=[...files];
    if(arr.length>5) throw new Error('Mỗi lần chỉ chọn tối đa 5 tệp.');
    const tooLarge=arr.find(f=>f.size>20*1024*1024);
    if(tooLarge) throw new Error(`${tooLarge.name} vượt quá 20 MB.`);
    return arr;
  }

  async function uploadFilesD1(documentId,files){
    for(let i=0;i<files.length;i++){
      const f=files[i];
      showToast('Đang tải tài liệu',`${i+1}/${files.length} · ${f.name}`);
      const encoded=await readFileAsBase64(f);
      await gasCall('apiD1AddDocumentFile',documentId,encoded);
    }
  }

  async function saveDocumentD1(){
    const title=document.getElementById('d1DocTitle')?.value.trim()||'';
    if(!title){showToast('Thiếu thông tin','Bạn chưa nhập trích yếu văn bản.');return;}

    const payload={
      title,
      document_no:document.getElementById('d1DocNo')?.value||'',
      direction:document.getElementById('d1DocDirection')?.value||'INCOMING',
      document_type:document.getElementById('d1DocType')?.value||'',
      issuer:document.getElementById('d1DocIssuer')?.value||'',
      issued_date:document.getElementById('d1DocIssuedDate')?.value||'',
      received_date:document.getElementById('d1DocReceivedDate')?.value||'',
      field:document.getElementById('d1DocField')?.value||'',
      priority:document.getElementById('d1DocPriority')?.value||'NORMAL',
      assignee_user_id:document.getElementById('d1DocAssignee')?.value||'',
      due_date:document.getElementById('d1DocDueDate')?.value||'',
      summary:document.getElementById('d1DocSummary')?.value||'',
      notes:document.getElementById('d1DocNotes')?.value||''
    };

    const btn=document.getElementById('d1SaveDocument');
    const modal=document.getElementById('d1DocumentModal');
    const editingId=D1.editingId;
    btn.disabled=true;
    btn.innerHTML='<span class="backend-spinner"></span> Đang lưu...';

    modal?.classList.remove('show');
    showSyncP2_(editingId?'Đang cập nhật văn bản…':'Đang lưu văn bản…');

    try{
      let saved;
      if(editingId){
        saved=await gasCall('apiD1UpdateDocument',D1.editingId,payload);
      }else{
        saved=await gasCall('apiD1CreateDocument',payload);
      }

      if(D1.selectedFiles.length){
        await uploadFilesD1(saved.document_id,D1.selectedFiles);
      }

      const uploadedCount=D1.selectedFiles.length;
      // closeDocumentModalD1() còn dọn editingId/files sau khi server xác nhận.
      closeDocumentModalD1();
      invalidateDocumentsP1();

      showToast(
        'Đã lưu văn bản',
        uploadedCount
          ? `Đã lưu hồ sơ và ${uploadedCount} tài liệu lên Google Drive.`
          : 'Thông tin văn bản đã được cập nhật.'
      );
      showSyncP2_('Văn bản đã đồng bộ','success',1400);

      // Refresh nền để thao tác lưu kết thúc ngay sau khi server xác nhận.
      loadDocumentsD1();
      if(editingId) setTimeout(()=>openDocumentD1(saved.document_id),30);
    }catch(err){
      modal?.classList.add('show');
      showSyncP2_('Đồng bộ thất bại','error',2200);
      showToast('Không thể lưu văn bản',err.message||String(err));
    }finally{
      btn.disabled=false;
      btn.innerHTML='<i data-lucide="save"></i> Lưu hồ sơ';
      lucide.createIcons();
    }
  }

  function historyDescriptionD1(h){
    const d=h.detail||{};
    if(h.action==='CREATE') return `Tạo hồ sơ ${d.document_no||''} · trạng thái ${d.status||'NEW'}`;
    if(h.action==='UPDATE_INFO') return 'Cập nhật thông tin hồ sơ văn bản.';
    if(h.action==='UPDATE_PROCESSING'){
      const bits=[];
      if(d.from_status!==d.to_status) bits.push(`${statusMeta(d.from_status)[0]} → ${statusMeta(d.to_status)[0]}`);
      if(d.from_assignee!==d.to_assignee) bits.push('thay đổi người xử lý');
      if(d.to_due_date) bits.push(`hạn ${formatDateTimeVN(d.to_due_date)}`);
      if(d.note) bits.push(d.note);
      return bits.join(' · ')||'Cập nhật xử lý.';
    }
    if(h.action==='ADD_FILE') return `Thêm tệp ${d.file_name||''}`;
    if(h.action==='NOTE') return d.note||'Ghi chú xử lý';
    if(h.action==='ARCHIVE') return d.note?`Lưu trữ · ${d.note}`:'Đưa hồ sơ vào lưu trữ.';
    if(h.action==='CREATE_TASK') return `Tạo nhiệm vụ: ${d.title||d.task_id||''}`;
    return 'Cập nhật hồ sơ.';
  }

  const humanSize = bytes => {
    const n=Number(bytes||0);
    if(!n) return '0 KB';
    const units=['B','KB','MB','GB'];
    let i=0,v=n;
    while(v>=1024&&i<units.length-1){v/=1024;i++}
    return `${v>=10||i===0?v.toFixed(0):v.toFixed(1)} ${units[i]}`;
  };

  const fileKind = mime => {
    const m=String(mime||'').toLowerCase();
    if(m.includes('pdf')) return ['PDF','pdf-preview','file-text'];
    if(m.includes('word')||m.includes('document')) return ['DOCX','word-preview','file-text'];
    if(m.includes('sheet')||m.includes('excel')||m.includes('spreadsheet')) return ['XLSX','sheet-preview','sheet'];
    if(m.includes('image')) return ['IMG','blue-soft','image'];
    return ['FILE','purple-soft','file'];
  };

  function renderReportB4(){
    const r=B4.report;
    if(!r) return;
    const s=r.stats;
    const total=Math.max(1,Number(s.totalTasks||0));
    const pct=n=>Math.round((Number(n||0)/total)*100);

    const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val};
    set('reportTotalTasks',s.totalTasks||0);
    set('reportCompletedTasks',s.completed||0);
    set('reportInProgressTasks',s.inProgress||0);
    set('reportOverdueTasks',s.overdue||0);
    set('reportTotalHint',`${s.totalDocuments||0} văn bản trong hệ thống`);
    set('reportCompletedHint',`${pct(s.completed)}% tổng nhiệm vụ`);
    set('reportProgressHint',`${pct(s.inProgress)}% tổng nhiệm vụ`);
    set('reportOverdueHint',s.overdue?`${s.overdue} nhiệm vụ cần chú ý`:'Không có nhiệm vụ quá hạn');

    const groups=document.getElementById('reportBarGroups');
    if(groups){
      const max=Math.max(1,...r.months.flatMap(m=>[m.completed,m.processing,m.overdue]));
      groups.innerHTML=r.months.map((m,i)=>{
        const h=v=>Math.max(5,Math.round((Number(v||0)/max)*145));
        return `<div class="bar-group ${i===r.months.length-1?'current':''}">
          <div>
            <i class="bar-done" style="height:${h(m.completed)}px" title="${m.completed} hoàn thành"></i>
            <i class="bar-doing" style="height:${h(m.processing)}px" title="${m.processing} đang xử lý"></i>
            <i class="bar-overdue" style="height:${h(m.overdue)}px" title="${m.overdue} quá hạn"></i>
          </div><span>${esc(m.label)}</span>
        </div>`;
      }).join('');
    }

    const completedPct=pct(s.completed);
    const progressPct=pct(s.inProgress);
    const overduePct=Math.max(0,100-completedPct-progressPct);
    const donut=document.getElementById('reportDonut');
    if(donut){
      donut.style.background=`conic-gradient(#16A34A 0 ${completedPct}%,#2563EB ${completedPct}% ${completedPct+progressPct}%,#DC2626 ${completedPct+progressPct}% 100%)`;
    }
    set('reportDonutTotal',s.totalTasks||0);

    const breakdown=document.getElementById('reportBreakdown');
    if(breakdown){
      breakdown.innerHTML=`
        <div><span><i class="legend-dot done"></i> Hoàn thành</span><strong>${s.completed||0} <small>${completedPct}%</small></strong></div>
        <div><span><i class="legend-dot doing"></i> Đang thực hiện</span><strong>${s.inProgress||0} <small>${progressPct}%</small></strong></div>
        <div><span><i class="legend-dot overdue"></i> Quá hạn</span><strong>${s.overdue||0} <small>${pct(s.overdue)}%</small></strong></div>`;
    }

    const attention=document.getElementById('reportAttentionList');
    if(attention){

  function applyAccessB5(){
    if(!B2.user) return;
    const role=B2.user.role||'';

    const pagePermission={
      dashboard:'dashboard.view',
      documents:'documents.view',
      tasks:'tasks.view',
      calendar:'calendar.view',
      meetings:'meetings.view',
      advisory:'advisory.use',
      reports:'reports.view',
      repository:'repository.view'
    };

    document.querySelectorAll('.nav-item[data-page]').forEach(item=>{
      const page=item.dataset.page;
      let allowed=true;
      if(page==='admin') allowed=role==='ADMIN';
      else if(page==='tools') allowed=Boolean(B2.user?.authenticated);
      else if(pagePermission[page]) allowed=hasPermissionB5(pagePermission[page]);
      item.classList.toggle('access-hidden',!allowed);
    });

    const controlRules=[
      ['.open-create-modal[data-type="document"]','documents.create'],
      ['#btnNewDocument','documents.create'],
      ['.open-create-modal[data-type="task"]','tasks.create'],
      ['.open-create-modal[data-type="calendar"]','calendar.create'],
      ['#dashboardAddCalendar','calendar.create'],
      ['.open-create-modal[data-type="meeting"]','meetings.create'],
      ['.repo-upload','repository.upload'],
      ['.repo-new-folder','repository.upload'],
      ['#reportExportPdf','reports.create']
    ];

    controlRules.forEach(([selector,permission])=>{
      document.querySelectorAll(selector).forEach(el=>{
        el.classList.toggle('access-hidden',!hasPermissionB5(permission));
      });
    });

    const quick=document.getElementById('quickCreate');
    if(quick){
      const quickPermissions=[
        'documents.create',
        'tasks.create',
        'meetings.create',
        'calendar.create',
        'advisory.use',
        'repository.upload'
      ];
      const buttons=quickMenu?.querySelectorAll('button')||[];
      buttons.forEach((btn,i)=>{
        const permission=quickPermissions[i];
        btn.classList.toggle('access-hidden',permission&&!hasPermissionB5(permission));
      });
      const canCreate=quickPermissions.some(hasPermissionB5);
      quick.classList.toggle('access-hidden',!canCreate);
    }

    document.getElementById('aiConfigBtn')?.classList.toggle('access-hidden',role!=='ADMIN');

    document.getElementById('documentCreateBtn')?.classList.toggle('access-hidden',!hasPermissionB5('documents.create'));
    document.getElementById('documentImportBtn')?.classList.toggle('access-hidden',!hasPermissionB5('documents.create'));
    document.getElementById('taskCreateBtn')?.classList.toggle('access-hidden',!hasPermissionB5('tasks.create'));

    const displayRole=roleLabelsB5[role]||role;
    document.querySelectorAll('.profile-text span,.sidebar-user-info span')
      .forEach(el=>el.textContent=displayRole);
  }

  function renderPermissionMatrixB5(){
    const table=document.getElementById('adminPermissionMatrix');
    if(!table||!B5.admin) return;

    const roles=B5.admin.roles||[];
    const users=B5.admin.users||[];
    const groups=[...new Set(permissionCatalogB5.map(x=>x.group))];

    const head=`<thead><tr>
      <th>Chức năng / quyền</th>
      ${roles.map(r=>{
        const activeCount=users.filter(u=>u.role===r.code&&u.status==='ACTIVE').length;
        return `<th class="permission-role-head" data-role="${esc(r.code)}"><strong>${esc(r.name)}</strong><small>${activeCount} tài khoản hoạt động</small></th>`;
      }).join('')}
    </tr></thead>`;

    const body=groups.map(group=>{
      const rows=permissionCatalogB5.filter(x=>x.group===group);
      return `<tr class="permission-group-row"><td colspan="${roles.length+1}">${esc(group)}</td></tr>`+
        rows.map(item=>`<tr>
          <td><div class="permission-name"><strong>${esc(item.label)}</strong><small>${esc(item.hint)}</small></div></td>
          ${roles.map(role=>{
            const yes=permissionGrantedB5_(role,item.permission);
            const limited=yes&&item.limited;
            return `<td title="${esc(item.permission)}"><span class="permission-check ${yes?(limited?'limited':'yes'):'no'}"><i data-lucide="${yes?(limited?'user-round-check':'check'):'minus'}"></i></span></td>`;
          }).join('')}
        </tr>`).join('');
    }).join('');

    table.innerHTML=head+'<tbody>'+body+'</tbody>';
  }

  function highlightPermissionRoleB5_(roleCode){
    document.querySelectorAll('[data-role-card]').forEach(card=>{
      card.classList.toggle('is-highlighted',Boolean(roleCode)&&card.dataset.roleCard===roleCode);
    });
    document.querySelectorAll('#adminPermissionMatrix .permission-role-focus').forEach(el=>el.classList.remove('permission-role-focus'));
    if(!roleCode||!B5.admin) return;
    const roles=B5.admin.roles||[];
    const index=roles.findIndex(r=>r.code===roleCode);
    if(index<0) return;
    document.querySelectorAll('#adminPermissionMatrix tr').forEach(row=>{
      const cell=row.children[index+1];
      cell?.classList.add('permission-role-focus');
    });
  }

  async function saveAdminUserB5(){
    const payload={
      full_name:document.getElementById('adminUserFullName')?.value||'',
      email:document.getElementById('adminUserEmail')?.value||'',
      department_id:document.getElementById('adminUserDepartment')?.value||'',
      role:document.getElementById('adminUserRole')?.value||'STAFF',

      phone:document.getElementById('adminUserPhone')?.value||'',
      password:document.getElementById('adminUserPassword')?.value||''

      document.getElementById('adminUserPassword')?.focus();
      return;

    const btn=document.getElementById('adminSaveUser');

      if(B5.editingUserId){

      await loadAdminB5();
      showToast('Đã lưu người dùng','Thông tin tài khoản đã được cập nhật.');

  const notificationTypeMetaB6 = type => ({
    TASK_ASSIGNED:['blue-dot','list-checks'],
    TASK_DUE_SOON:['amber-dot','clock-3'],
    TASK_OVERDUE:['red-dot','circle-alert'],

  }[type] || ['blue-dot','bell']);

  const relativeTimeB6 = value => {
    if(!value) return '';
    const d=new Date(value);
    if(isNaN(d)) return '';
    const diff=Math.max(0,Date.now()-d.getTime());
    const min=Math.floor(diff/60000);
    if(min<1) return 'Vừa xong';
    if(min<60) return `${min} phút`;
    const hour=Math.floor(min/60);
    if(hour<24) return `${hour} giờ`;
    const day=Math.floor(hour/24);
    if(day<7) return `${day} ngày`;
    return formatDateVN(value);
  };

  async function submitAdvisory() {
    const text = advisoryPrompt?.value.trim();
    if (!text) return;

    addChat('user', text);
    advisoryPrompt.value = '';

    const thinking=addChat(
      'assistant',
      `<div class="ai-thinking"><span class="backend-spinner"></span><span>Đang phân tích tài liệu và tạo bản nháp...</span></div>`,
      {rawHtml:true}
    );

    if(sendAdvisory){
      sendAdvisory.disabled=true;
      sendAdvisory.innerHTML='<span class="backend-spinner"></span> Đang xử lý';
    }

    try{
      const result=await gasCall('apiC1RunAdvisory',{
        prompt:text,
        taskType:C1.taskType,
        fileIds:C1.selectedFiles.map(f=>f.id)
      });

      thinking?.remove();

      const outputId='c2_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
      C2.outputs[outputId]={
        outputId,
        text:result.output||'',
        prompt:text,
        taskType:C1.taskType,
        files:[...C1.selectedFiles],
        draftId:'',
        sourceType:'',
        sourceId:'',
        driveUrl:'',
        modelUsed:result.modelUsed||C1.config?.model||''

      addChat(
        'assistant',
        result.output||'',
        {

          actionsHtml:renderAiResultActionsC2(outputId)

      );
    }catch(err){
      thinking?.remove();
      addChat(

        {
          disclaimer:'Kiểm tra cấu hình AI/API key hoặc định dạng tài liệu.'

      );
    }finally{

        lucide.createIcons();

  function draftTitleC2(output){
    const first=(output.text||'').split('\n').map(x=>x.trim()).find(Boolean)||'';
    const clean=first.replace(/^#+\s*/,'').replace(/[*_`]/g,'').trim();
    if(clean && clean.length<=130) return clean;
    return `${draftTypeLabelC2(output.taskType)} - ${new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date())}`;
  }

  function setOutputStatusC2(outputId,text){
    const el=document.getElementById(`c2Status_${outputId}`);
    if(el) el.innerHTML=text;
  }

  async function ensureSavedDraftC2(outputId){
    const output=C2.outputs[outputId];
    if(!output) throw new Error('Không tìm thấy kết quả AI.');

    const saved=await gasCall('apiC2SaveDraft',{
      draft_id:output.draftId||'',
      draft_type:output.taskType,
      title:draftTitleC2(output),
      content:output.text,
      source_type:output.sourceType||'',
      source_id:output.sourceId||''
    });

    output.draftId=saved.draft_id;
    output.sourceType=saved.source_type||'';
    output.sourceId=saved.source_id||'';
    output.driveUrl=saved.drive_url||output.driveUrl||'';

    setOutputStatusC2(
      outputId,
      `Đã lưu bản nháp · phiên bản <strong>${saved.version}</strong>${saved.drive_url?' · <strong>đã xuất Docs</strong>':''}`
    );

    return saved;
  }

  async function exportOutputC2(outputId){
    try{
      const saved=await ensureSavedDraftC2(outputId);
      setOutputStatusC2(outputId,'Đang tạo Google Docs...');
      const exported=await gasCall('apiC2ExportDraftToGoogleDoc',saved.draft_id);
      const output=C2.outputs[outputId];
      output.driveUrl=exported.drive_url||'';

      setOutputStatusC2(
        outputId,
        `Đã xuất Google Docs · <a href="${esc(exported.drive_url)}" target="_blank">Mở tài liệu</a>`
      );

      if(exported.drive_url) window.open(exported.drive_url,'_blank','noopener');
    }catch(err){
      showToast('Không thể xuất Google Docs',err.message||String(err));
    }
  }

  async function saveDraftLinkC2(){

    const type=document.getElementById('draftLinkType')?.value||'DOCUMENT';
    const sourceId=document.getElementById('draftLinkSource')?.value||'';

  function renderMiniCalendarF1(){
    const title=document.getElementById('miniCalendarTitle');
    const grid=document.getElementById('miniCalendarGrid');
    if(!title||!grid) return;

    const anchor=F1.miniCalendarAnchor||new Date();
    const y=anchor.getFullYear(),m=anchor.getMonth();
    title.textContent=`Tháng ${m+1}, ${y}`;

    const first=new Date(y,m,1);
    const offset=(first.getDay()+6)%7;
    const start=new Date(y,m,1-offset);
    const selected=dateKeyLocal(calendarAnchor);
    const today=dateKeyLocal(new Date());
    const eventDays=new Set((B2.calendarEvents||[]).map(e=>String(e.event_date||'').slice(0,10)));

    grid.innerHTML=Array.from({length:42},(_,i)=>{
      const d=addDays(start,i);
      const key=dateKeyLocal(d);
      const outside=d.getMonth()!==m;
      return `<button class="mini-cal-day ${outside?'muted-day':''} ${key===selected?'selected-day':''} ${key===today?'today-mini':''}" data-mini-date="${key}">
        <span>${d.getDate()}</span>${eventDays.has(key)?'<i></i>':''}
      </button>`;
    }).join('');
  }

  function filteredCalendarEventsF1(){
    const enabled=enabledCalendarGroups();
    return (B2.calendarEvents||[])
      .filter(e=>enabled.includes(e.calendar_group||'GENERAL'))
      .filter(e=>!e.status||e.status==='ACTIVE')
      .sort((a,b)=>{
        const aa=String(a.event_date||'')+'T'+String(a.start_time||'00:00');
        const bb=String(b.event_date||'')+'T'+String(b.start_time||'00:00');
        return aa.localeCompare(bb);
      });
  }

  function renderWeekCalendarF1(){
    const header=document.getElementById('calendarWeekHeader');
    const body=document.getElementById('calendarWeekBody');
    if(!header||!body) return;

    const monday=startOfWeek(calendarAnchor);
    const sunday=addDays(monday,6);
    const weekdays=['T2','T3','T4','T5','T6','T7','CN'];
    const title=document.getElementById('calendarRangeTitle');
    if(title){
      title.textContent=monday.getMonth()===sunday.getMonth()
        ? `${monday.getDate()} – ${sunday.getDate()} tháng ${monday.getMonth()+1}, ${monday.getFullYear()}`
        : `${monday.getDate()}/${monday.getMonth()+1} – ${sunday.getDate()}/${sunday.getMonth()+1}/${sunday.getFullYear()}`;
    }
    const wk=document.getElementById('calendarWeekNumber');
    if(wk) wk.textContent=`Tuần ${isoWeekNumber(monday)}`;

    const todayKey=dateKeyLocal(new Date());
    header.innerHTML='<div class="time-head"></div>'+weekdays.map((w,i)=>{
      const d=addDays(monday,i);
      return `<div class="${dateKeyLocal(d)===todayKey?'today-col':''}"><span>${w}</span><strong>${d.getDate()}</strong></div>`;
    }).join('');

    const events=filteredCalendarEventsF1().filter(e=>{
      const k=String(e.event_date||'').slice(0,10);
      return k>=dateKeyLocal(monday)&&k<=dateKeyLocal(sunday);
    });

    const times=Array.from({length:12},(_,i)=>`${String(i+7).padStart(2,'0')}:00`);
    let html=`<div class="time-column">${times.map(t=>`<span>${t}</span>`).join('')}</div>`;

    for(let i=0;i<7;i++){
      const day=addDays(monday,i);
      const key=dateKeyLocal(day);
      const dayEvents=events.filter(e=>String(e.event_date||'').slice(0,10)===key);
      let col=`<div class="day-column ${key===todayKey?'today-column-bg':''}">`;

      dayEvents.forEach(e=>{
        const start=timeToMinutes(e.start_time);
        const end=e.end_time?timeToMinutes(e.end_time):start+60;
        const top=Math.max(0,(start-7*60)/60*50);
        const height=Math.max(36,(Math.max(end,start+30)-start)/60*50);
        col+=`<button class="cal-event ${eventClassByGroup(e.calendar_group)} b3-event-detail" data-id="${esc(e.event_id)}" style="top:${top}px;height:${height}px">
          <strong>${esc(e.title)}</strong><span>${esc(e.start_time||'')} ${e.location?'· '+esc(e.location):''}</span>
        </button>`;
      });
      col+='</div>';
      html+=col;
    }
    body.innerHTML=html;
  }

  function renderMonthCalendarF1(){
    const box=document.getElementById('calendarMonthView');
    if(!box) return;
    const y=calendarAnchor.getFullYear(),m=calendarAnchor.getMonth();
    const first=new Date(y,m,1);
    const offset=(first.getDay()+6)%7;
    const start=new Date(y,m,1-offset);
    const events=filteredCalendarEventsF1();
    const today=dateKeyLocal(new Date());

    box.innerHTML=`
      <div class="f1-month-weekdays">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<span>${x}</span>`).join('')}</div>
      <div class="f1-month-grid">
      ${Array.from({length:42},(_,i)=>{
        const d=addDays(start,i),key=dateKeyLocal(d);
        const dayEvents=events.filter(e=>String(e.event_date||'').slice(0,10)===key).slice(0,3);
        return `<div class="f1-month-cell ${d.getMonth()!==m?'outside':''} ${key===today?'today':''}" data-date="${key}">
          <button class="f1-month-day" data-calendar-create-date="${key}">${d.getDate()}</button>
          <div class="f1-month-events">${dayEvents.map(e=>`<button class="f1-month-event ${eventClassByGroup(e.calendar_group)} b3-event-detail" data-id="${esc(e.event_id)}">${esc(e.start_time||'')} ${esc(e.title)}</button>`).join('')}</div>
          ${events.filter(e=>String(e.event_date||'').slice(0,10)===key).length>3?`<small>+${events.filter(e=>String(e.event_date||'').slice(0,10)===key).length-3} lịch</small>`:''}
        </div>`;
      }).join('')}
      </div>`;
    const title=document.getElementById('calendarRangeTitle');
    if(title) title.textContent=`Tháng ${m+1}, ${y}`;
    const wk=document.getElementById('calendarWeekNumber');
    if(wk) wk.textContent=`${events.filter(e=>String(e.event_date||'').slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`).length} sự kiện`;

  const meetingStatusTextF1 = s => ({
    PLANNED:'Dự kiến',IN_PROGRESS:'Đang diễn ra',COMPLETED:'Hoàn thành',CANCELLED:'Đã hủy'

  function renderMeetingsB3(){
    const box=document.getElementById('meetingCards');
    if(!box) return;
    const now=new Date();
    const all=B2.meetings||[];
    const upcoming=all.filter(m=>meetingDateTime(m)>=now && !['COMPLETED','CANCELLED'].includes(m.status));
    const past=all.filter(m=>meetingDateTime(m)<now || m.status==='COMPLETED');
    const cancelled=all.filter(m=>m.status==='CANCELLED');

    const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
    set('meetingUpcomingCount',upcoming.length);
    set('meetingPastCount',past.length);
    set('meetingAllCount',all.length);

    let list=meetingFilter==='past'?past:meetingFilter==='all'?all:upcoming;
    if(meetingFilter!=='all') list=list.filter(m=>m.status!=='CANCELLED');

    box.innerHTML=list.length?list.map((m,idx)=>{
      const d=new Date(String(m.meeting_date||'').slice(0,10)+'T00:00:00');
      const status=meetingStatusLabel(m);
      return `<article class="meeting-card ${idx===0&&meetingFilter==='upcoming'?'featured':''} b3-meeting-detail" data-id="${esc(m.meeting_id)}">
        <div class="meeting-date ${idx===0&&meetingFilter==='upcoming'?'red-date':''}"><strong>${isNaN(d)?'—':String(d.getDate()).padStart(2,'0')}</strong><span>${isNaN(d)?'':'THÁNG '+(d.getMonth()+1)}</span></div>
        <div class="meeting-info">
          <div class="meeting-title-row"><span class="status ${m.status==='CANCELLED'?'status-danger':status[1]}">${esc(m.status==='CANCELLED'?'Đã hủy':status[0])}</span><span class="meeting-type">${esc(m.meeting_type||'Cuộc họp')}</span></div>
          <h2>${esc(m.title)}</h2><p>${esc(m.agenda||'Chưa nhập chương trình.')}</p>
          <div class="meeting-meta"><span><i data-lucide="map-pin"></i> ${esc(m.location||'Chưa xác định')}</span><span><i data-lucide="users"></i> ${Number(m.member_count||0)} người</span><span><i data-lucide="paperclip"></i> ${Number(m.file_count||0)} tài liệu</span><span><i data-lucide="list-checks"></i> ${Number(m.task_count||0)} nhiệm vụ</span></div>
        </div>
        <div class="meeting-action"><button class="btn btn-light btn-sm">Mở hồ sơ</button></div>
      </article>`;
    }).join(''):`<div class="panel empty-data" style="min-height:260px"><i data-lucide="calendar-x"></i><strong>Chưa có cuộc họp trong nhóm này</strong><span>Tạo cuộc họp để bắt đầu.</span></div>`;

    if(filter==='ALL'||item.type==='folder') return true;
    const m=String(item.mimeType||'').toLowerCase();
    if(filter==='PDF') return m.includes('pdf');
    if(filter==='DOC') return m.includes('word')||m.includes('document');
    if(filter==='SHEET') return m.includes('sheet')||m.includes('excel')||m.includes('spreadsheet');
    if(filter==='IMAGE') return m.includes('image');
    return !m.includes('pdf')&&!m.includes('word')&&!m.includes('document')&&!m.includes('sheet')&&!m.includes('excel')&&!m.includes('spreadsheet')&&!m.includes('image');
  };

  function repositoryDisplayItemsF1(){

    let folders=[...(B4.repoData.folders||[])];

      folders.sort((a,b)=>a.name.localeCompare(b.name,'vi'));

      files.sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));

  function renderReportB4(){
    const r=B4.report;if(!r)return;const s=r.stats||{};
    const total=Math.max(1,Number(s.totalTasks||0)),pct=n=>Math.round(Number(n||0)/total*100);
    const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
    set('reportTotalTasks',s.totalTasks||0);set('reportCompletedTasks',s.completed||0);set('reportInProgressTasks',s.inProgress||0);set('reportOverdueTasks',s.overdue||0);
    set('reportTotalHint',`${s.totalDocuments||0} văn bản trong kỳ`);set('reportCompletedHint',`${pct(s.completed)}% tổng nhiệm vụ`);set('reportProgressHint',`${pct(s.inProgress)}% tổng nhiệm vụ`);set('reportOverdueHint',s.overdue?`${s.overdue} nhiệm vụ cần chú ý`:'Không có nhiệm vụ quá hạn');

    const groups=document.getElementById('reportBarGroups');
    if(groups){const max=Math.max(1,...(r.months||[]).flatMap(m=>[m.completed,m.processing,m.overdue]));groups.innerHTML=(r.months||[]).map((m,i)=>{const h=v=>Math.max(4,Math.round(Number(v||0)/max*145));return `<div class="bar-group ${i===r.months.length-1?'current':''}"><div><i class="bar-done" style="height:${h(m.completed)}px"></i><i class="bar-doing" style="height:${h(m.processing)}px"></i><i class="bar-overdue" style="height:${h(m.overdue)}px"></i></div><span>${esc(m.label)}</span></div>`}).join('')}

    const completedPct=pct(s.completed),progressPct=pct(s.inProgress),overduePct=pct(s.overdue);
    const donut=document.getElementById('reportDonut');if(donut)donut.style.background=`conic-gradient(#16A34A 0 ${completedPct}%,#2563EB ${completedPct}% ${completedPct+progressPct}%,#DC2626 ${completedPct+progressPct}% 100%)`;
    set('reportDonutTotal',s.totalTasks||0);
    const breakdown=document.getElementById('reportBreakdown');if(breakdown)breakdown.innerHTML=`<div><span><i class="legend-dot done"></i> Hoàn thành</span><strong>${s.completed||0} <small>${completedPct}%</small></strong></div><div><span><i class="legend-dot doing"></i> Đang thực hiện</span><strong>${s.inProgress||0} <small>${progressPct}%</small></strong></div><div><span><i class="legend-dot overdue"></i> Quá hạn</span><strong>${s.overdue||0} <small>${overduePct}%</small></strong></div>`;

    const attention=document.getElementById('reportAttentionList');if(attention)attention.innerHTML=(r.attention||[]).length?r.attention.map(t=>{const st=statusMeta(t.effective_status||t.status);return `<div class="b2-task-detail" data-id="${esc(t.task_id)}"><span class="attention-status ${t.effective_status==='OVERDUE'?'overdue-att':'due-att'}"><i data-lucide="${t.effective_status==='OVERDUE'?'circle-alert':'clock-3'}"></i></span><div><strong>${esc(t.title)}</strong><small>${esc(t.owner_name||'Chưa giao')} · ${formatDateTimeVN(t.due_date)}</small></div><span class="status ${st[1]}">${st[0]}</span></div>`}).join(''):'<div class="empty-data"><i data-lucide="circle-check-big"></i><strong>Không có nhiệm vụ cần chú ý</strong></div>';

    const deps=document.getElementById('reportDepartmentFilter');
    if(deps&&deps.options.length<=1){
      deps.innerHTML='<option value="ALL">Tất cả đơn vị</option>'+(r.departments||[]).map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('');
      deps.value=F1.reportFilters.departmentId||'ALL';
    }
    const updated=document.getElementById('reportUpdated');if(updated)updated.innerHTML=`<i data-lucide="refresh-cw"></i> ${formatDateTimeVN(r.generatedAt)}`;
    lucide.createIcons();
  }

  const anchorInput=document.getElementById('reportAnchorDate');if(anchorInput&&!anchorInput.value)anchorInput.value=dateKeyLocal(new Date());

  document.getElementById('systemInstallReminder')?.addEventListener('click',async()=>{try{const r=await gasCall('apiF1InstallReminderTrigger');showToast('Đã cài nhắc việc',r.message||'Trigger đã được cài.');await loadSystemDiagnosticsF1()}catch(err){showToast('Không thể cài trigger',err.message||String(err))}});
  document.getElementById('systemCreateBackup')?.addEventListener('click',async()=>{try{const r=await gasCall('apiF1CreateBackup');showToast('Đã sao lưu',r.name||'Bản sao dữ liệu đã được tạo.');if(r.url)window.open(r.url,'_blank','noopener')}catch(err){showToast('Không thể sao lưu',err.message||String(err))}});

  globalSearch?.addEventListener('input',()=>{clearTimeout(globalSearchTimerF1);globalSearchTimerF1=setTimeout(runGlobalSearchF1,320)});
  document.getElementById('globalSearchResults')?.addEventListener('click',async e=>{
    const row=e.target.closest('.global-search-result');if(!row)return;
    document.getElementById('globalSearchResults')?.classList.add('hidden-block');
    const type=row.dataset.type,id=row.dataset.id;
    if(type==='DOCUMENT'){document.querySelector('.nav-item[data-page="documents"]')?.click();setTimeout(()=>openDocumentD1(id),80)}
    else if(type==='TASK'){document.querySelector('.nav-item[data-page="tasks"]')?.click();setTimeout(()=>openTaskD2(id),80)}
    else if(type==='MEETING'){document.querySelector('.nav-item[data-page="meetings"]')?.click();setTimeout(()=>openB3Meeting(id),100)}
  });


  function simpleCompareF1(a,b){
    const left=String(a||'').split(/\r?\n/);
    const right=String(b||'').split(/\r?\n/);
    const max=Math.max(left.length,right.length);
    const rows=[];
    let changed=0;
    for(let i=0;i<max;i++){
      const x=left[i]??'',y=right[i]??'';
      if(x===y) continue;
      changed++;
      rows.push(`<div class="f1-diff-row"><span>Dòng ${i+1}</span><del>${esc(x||'∅')}</del><ins>${esc(y||'∅')}</ins></div>`);
    }
    return {changed,html:rows.join('')};
  }

  function proofreadBasicF1(text){
    const issues=[];
    if(/ {2,}/.test(text)) issues.push('Có khoảng trắng liên tiếp.');
    if(/\s+[,.!?;:]/.test(text)) issues.push('Có khoảng trắng thừa trước dấu câu.');
    if(/[,.!?;:][^\s\n”"')\]]/.test(text)) issues.push('Có vị trí thiếu khoảng trắng sau dấu câu.');
    if(/\n{3,}/.test(text)) issues.push('Có quá nhiều dòng trống liên tiếp.');
    if(!/[.!?…]\s*$/.test(text.trim())&&text.trim()) issues.push('Nội dung chưa kết thúc bằng dấu câu.');
    const placeholders=(text.match(/\[CẦN BỔ SUNG:[^\]]+\]/gi)||[]).length;
    if(placeholders) issues.push(`Còn ${placeholders} vị trí [CẦN BỔ SUNG].`);
    return issues;
  }

  function moveToolToAdvisoryF1(promptText){
    closeToolModal();
    document.querySelector('.nav-item[data-page="advisory"]')?.click();
    setTimeout(()=>{
      const ta=document.getElementById('advisoryPrompt');
      if(ta){ta.value=promptText;ta.focus()}
    },100);
  }

  function runToolF1(type){
    if(type==='compare'){
      const a=document.getElementById('toolCompareA')?.value||'',b=document.getElementById('toolCompareB')?.value||'';
      const result=document.getElementById('toolResult');
      if(!a&&!b){showToast('Chưa có nội dung','Dán hai phiên bản để so sánh.');return}
      const diff=simpleCompareF1(a,b);
      if(result)result.innerHTML=diff.changed?`<strong>Phát hiện ${diff.changed} dòng khác nhau</strong>${diff.html}`:'<strong>Hai nội dung giống nhau.</strong>';
      return;
    }
    if(type==='proofread'){
      const text=document.getElementById('toolProofread')?.value||'';
      if(!text.trim()){showToast('Chưa có nội dung','Dán văn bản cần kiểm tra.');return}
      const issues=proofreadBasicF1(text);
      const result=document.getElementById('toolResult');
      if(result)result.innerHTML=issues.length?`<strong>Phát hiện ${issues.length} điểm cần rà soát</strong><ul>${issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<strong>Không phát hiện lỗi định dạng cơ bản.</strong><p>Nếu cần rà soát sâu về nội dung và logic, dùng Trợ lý tham mưu.</p>';
      return;
    }
    if(type==='voice'){
      const text=document.getElementById('toolVoiceText')?.value||'';
      if(!text.trim()){showToast('Chưa có nội dung','Dán nội dung cần đọc.');return}
      if(!('speechSynthesis' in window)){showToast('Không hỗ trợ','Trình duyệt này không hỗ trợ đọc văn bản.');return}
      speechSynthesis.cancel();
      const utter=new SpeechSynthesisUtterance(text);
      utter.lang='vi-VN';utter.rate=1;
      speechSynthesis.speak(utter);
      showToast('Đang đọc văn bản','Có thể đóng cửa sổ, trình duyệt vẫn tiếp tục đọc.');
      return;
    }
    if(type==='report'){
      if(!hasPermissionB5('reports.view')){
        showToast('Không có quyền','Tài khoản này chưa được cấp quyền xem Báo cáo.');
        return;
      }
      closeToolModal();document.querySelector('.nav-item[data-page="reports"]')?.click();return;
    }

    if(['ocr','summary','draft','speech'].includes(type) && !hasPermissionB5('advisory.use')){
      showToast('Không có quyền','Công cụ này cần quyền sử dụng Trợ lý tham mưu.');
      return;
    }

    const prompt=document.getElementById('toolPrompt')?.value?.trim()||'';
    const defaults={
      ocr:'Hãy trích xuất nguyên văn nội dung từ ảnh hoặc PDF scan tôi đính kèm, giữ bố cục xuống dòng cơ bản và không tự bổ sung nội dung.',
      summary:'Hãy tóm tắt nội dung sau thành các ý chính phục vụ công việc: ',
      draft:'Hãy soạn dự thảo văn bản hành chính theo yêu cầu sau: ',
      speech:'Hãy xây dựng dàn ý và bản nháp bài phát biểu từ nội dung sau: '
    };
    moveToolToAdvisoryF1((defaults[type]||'Hỗ trợ nội dung sau: ')+prompt);
  }

  // Tool modal
  const toolModal = document.getElementById('toolModal');
  const toolModalTitle = document.getElementById('toolModalTitle');
  const toolModalBody = document.getElementById('toolModalBody');
  const runToolAction = document.getElementById('runToolAction');

  const toolTitles = {
    compare:'So sánh văn bản', ocr:'OCR tài liệu', summary:'Tóm tắt tài liệu', proofread:'Kiểm tra văn bản',
    draft:'Soạn văn bản', speech:'Gợi ý bài phát biểu', report:'Tổng hợp báo cáo', voice:'Văn bản → giọng nói'
  };

  const toolBodies = {
    compare: `<div class="f1-compare-grid"><label class="form-field"><span>Văn bản gốc</span><textarea id="toolCompareA" rows="12" placeholder="Dán nội dung bản gốc..."></textarea></label><label class="form-field"><span>Văn bản mới</span><textarea id="toolCompareB" rows="12" placeholder="Dán nội dung bản mới..."></textarea></label></div><div id="toolResult" class="f1-tool-result"></div>`,
    ocr: `<div class="tool-single-form"><p class="f1-tool-help">OCR ảnh/PDF được xử lý qua Trợ lý tham mưu. Mở Trợ lý, đính kèm ảnh/PDF và hệ thống sẽ trích xuất nội dung.</p><textarea id="toolPrompt" rows="5" placeholder="Yêu cầu OCR bổ sung (không bắt buộc)..."></textarea></div>`,
    summary: `<div class="tool-single-form"><textarea id="toolPrompt" rows="8" placeholder="Nhập yêu cầu tóm tắt hoặc nội dung cần tóm tắt..."></textarea></div>`,
    proofread: `<div class="tool-single-form"><textarea id="toolProofread" rows="12" placeholder="Dán nội dung văn bản cần kiểm tra..."></textarea><div id="toolResult" class="f1-tool-result"></div></div>`,
    draft: `<div class="tool-single-form"><textarea id="toolPrompt" rows="10" placeholder="Mô tả văn bản cần soạn..."></textarea></div>`,
    speech: `<div class="tool-single-form"><textarea id="toolPrompt" rows="10" placeholder="Nhập chủ đề, bối cảnh và các ý chính..."></textarea></div>`,
    report: `<div class="tool-single-form"><p class="f1-tool-help">Mở Báo cáo điều hành để tổng hợp dữ liệu thật và xuất PDF.</p></div>`,
    voice: `<div class="tool-single-form"><textarea id="toolVoiceText" rows="12" placeholder="Dán nội dung cần đọc..."></textarea><div id="toolResult" class="f1-tool-result">Dùng giọng tiếng Việt của trình duyệt.</div></div>`
  };

  const openToolModal = type => {
    F1.activeTool=type;
    toolModalTitle.textContent = toolTitles[type] || 'Công cụ';
    toolModalBody.innerHTML = toolBodies[type] || '';
    toolModal.classList.add('show');
    lucide.createIcons();
  };
  const closeToolModal = () => toolModal.classList.remove('show');

  document.querySelectorAll('.tool-launch').forEach(btn => btn.addEventListener('click', () => openToolModal(btn.dataset.tool)));
  document.querySelectorAll('.close-tool-modal').forEach(btn => btn.addEventListener('click', closeToolModal));
  toolModal?.addEventListener('click', e => { if (e.target === toolModal) closeToolModal(); });
  runToolAction?.addEventListener('click', () => {
    runToolF1(F1.activeTool);
  });


  globalSearch?.addEventListener('keydown', e => {
    if (e.key === 'Enter' && globalSearch.value.trim()) {
      e.preventDefault();
      runGlobalSearchF1();
    }
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault(); globalSearch?.focus();
    }
    if (e.key === 'Escape') {
      quickMenu?.classList.remove('show');
      notificationPanel?.classList.remove('show');
      closeMobileSidebar();
      closeDrawer();
      closeModal();
      document.getElementById('toolModal')?.classList.remove('show');
    }
  });
});
</script>

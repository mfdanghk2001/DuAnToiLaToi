      page:1,
      pageSize:10
    },
    list:null,
    current:null,
    editingId:'',
    selectedFiles:[]
  };

  const gasCall = (fn, ...args) => new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) {
      reject(new Error('Không tìm thấy môi trường Google Apps Script.'));
      return;
    }
    let runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(new Error(err?.message || String(err))));
    runner[fn](...args);
  });

  const esc = value => String(value ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'","&#039;");

  const formatDateVN = value => {
    if (!value) return '—';
    const d = new Date(value);
    if (isNaN(d)) return esc(value);
    return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d);
  };

  const formatDateTimeVN = value => {
    if (!value) return '—';
    const d = new Date(value);
    if (isNaN(d)) return esc(value);
    return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);
  };

  const initials = name => {
    const s = String(name || 'U').trim().split(/\s+/);
    return ((s[0]?.[0] || '') + (s[s.length-1]?.[0] || '')).toUpperCase();
  };

  const statusMeta = status => ({
    NEW:['Mới tiếp nhận','status-new'],
    PROCESSING:['Đang xử lý','status-progress'],
    IN_PROGRESS:['Đang thực hiện','status-progress'],
    WAITING_APPROVAL:['Chờ duyệt','status-review'],
    COMPLETED:['Hoàn thành','status-success'],
    ARCHIVED:['Lưu trữ','status-new'],
    OVERDUE:['Quá hạn','status-danger'],
    CANCELLED:['Đã hủy','status-new']
  }[status] || [status || 'Chưa xác định','status-new']);

  const directionLabel = x => ({INCOMING:'Văn bản đến',OUTGOING:'Văn bản đi',DRAFT:'Dự thảo'}[x] || x || 'Văn bản');

  const userName = id => {
    const u=B2.users.find(x=>x.user_id===id);

  const showBackendError = msg => {
    const banner=document.getElementById('backendBanner');

    banner.classList.remove('hidden');
    banner.classList.add('error');
    banner.innerHTML=`<div><strong>Không tải được dữ liệu</strong><span>${esc(msg)}</span></div>`;
  };

  const hideBackendBanner = () => document.getElementById('backendBanner')?.classList.add('hidden');

  const renderUser = () => {
    if (!B2.user) return;
    const name=B2.user.fullName || B2.user.email || 'Người dùng';
    document.querySelectorAll('.profile-text strong,.sidebar-user-info strong').forEach(el=>el.textContent=name);
    document.querySelectorAll('.profile-text span,.sidebar-user-info span').forEach(el=>el.textContent=B2.user.role || 'Người dùng');
    document.querySelectorAll('.profile-chip .avatar,.sidebar-user .avatar').forEach(el=>el.textContent=initials(name));

  const renderDashboard = () => {
    const d=B2.dashboard;
    if (!d) return;
    const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=String(v).padStart(2,'0')};
    set('dashNewDocuments',d.stats.newDocuments);
    set('dashTasksToday',d.stats.tasksToday);
    set('dashDueSoon',d.stats.dueSoon);
    set('dashOverdue',d.stats.overdue);

    document.getElementById('navTaskCount') && (document.getElementById('navTaskCount').textContent=d.tasks.total);

    const taskBox=document.getElementById('dashboardTaskList');
    if (taskBox) {
      if (!d.priorityTasks.length) taskBox.innerHTML=`<div class="empty-data"><i data-lucide="circle-check-big"></i><strong>Chưa có nhiệm vụ cần xử lý</strong><span>Các nhiệm vụ mới sẽ xuất hiện tại đây.</span></div>`;
      else taskBox.innerHTML=d.priorityTasks.map(t=>{

          <span><i data-lucide="calendar-clock"></i> ${formatDateTimeVN(t.due_date)}</span>

      }).join('');
    }

    const docBox=document.getElementById('dashboardDocumentList');
    if (docBox) {
      if (!d.recentDocuments.length) docBox.innerHTML=`<div class="empty-data"><i data-lucide="files"></i><strong>Chưa có văn bản</strong><span>Tiếp nhận văn bản đầu tiên để bắt đầu.</span></div>`;
      else docBox.innerHTML=d.recentDocuments.map(x=>`<article class="document-row b2-document-detail" data-id="${esc(x.document_id)}">
        <div class="doc-icon"><i data-lucide="file-text"></i></div><div class="doc-main">
        <div class="doc-top"><strong>${esc(x.document_no||'Chưa có số')}</strong>${x.status==='NEW'?'<span class="new-badge">Mới</span>':''}</div>
        <h3>${esc(x.title)}</h3><div class="doc-meta">${esc(x.issuer||directionLabel(x.direction))} · ${formatDateVN(x.received_date)}</div></div>
        <button class="btn btn-light btn-sm">Xem</button></article>`).join('');

    lucide.createIcons();

  const renderDocuments = () => {
    // D1 owns the complete Văn bản page.
    // B2 still supplies Dashboard data and cross-module references.
    const d=B2.dashboard;
    if (d) {
      const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=String(v).padStart(2,'0')};
      set('docIncomingCount',d.documents.incoming);
      set('docOutgoingCount',d.documents.outgoing);
      set('docProcessingCount',d.documents.processing);
      set('docDueSoonCount',d.documents.dueSoon);
    }
  };

  const renderTasks = () => {
    const d=B2.dashboard;
    if (d) {
      [['taskNewCount',d.tasks.newCount],['taskProgressCount',d.tasks.inProgress],['taskWaitingCount',d.tasks.waitingApproval],['taskOverdueCount',d.tasks.overdue]]
        .forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.textContent=String(v).padStart(2,'0')});

      box.innerHTML=`<div class="empty-data"><i data-lucide="list-checks"></i><strong>Chưa có nhiệm vụ</strong><span>Bấm “Giao nhiệm vụ” để tạo công việc đầu tiên.</span></div>`;
      lucide.createIcons(); return;
    }
    box.innerHTML=B2.tasks.map(t=>{

      const priority=t.priority==='URGENT'?'high':t.priority==='HIGH'?'medium':'normal';
      const owner=t.owner_name||userName(t.owner_user_id)||'Chưa giao';
      const progress=Number(t.progress||0);
      return `<article class="task-full-row b2-task-detail" data-id="${esc(t.task_id)}">
        <button class="task-check"><i data-lucide="circle"></i></button><div class="priority-bar ${priority}"></div>
        <div class="task-full-main"><div class="task-full-title"><strong>${esc(t.title)}</strong><span class="status ${st[1]}">${st[0]}</span></div>
        <p>${esc(t.description||'Chưa có mô tả.')}</p><div class="task-full-meta">

        <span class="tag">${esc(t.priority||'NORMAL')}</span></div></div>
        <div class="progress-cell"><div class="tiny-progress"><span style="width:${progress}%"></span></div><small>${progress}%</small></div>
        <button class="icon-btn"><i data-lucide="more-horizontal"></i></button></article>`;
    }).join('');
    lucide.createIcons();
  };

  const renderAllB2 = () => {
    renderUser(); renderDashboard(); renderDocuments(); renderTasks();
  };

  const refreshB2 = async () => {
    const data=await gasCall('apiRefreshB2');
    if (!data?.ok) throw new Error(data?.message||'Không tải được dữ liệu.');
    B2.dashboard=data.dashboard;
    B2.documents=data.documents||[];
    B2.tasks=data.tasks||[];
    B2.calendarEvents=data.calendarEvents||[];
    B2.meetings=data.meetings||[];
    renderAllB2();
    applyAccessB5();

  const readFileAsBase64 = file => new Promise((resolve,reject)=>{
    if (!file) return resolve(null);
    const r=new FileReader();
    r.onload=()=>resolve({name:file.name,mimeType:file.type||'application/octet-stream',base64:r.result});
    r.onerror=()=>reject(new Error('Không đọc được file đính kèm.'));
    r.readAsDataURL(file);
  });

  const field = (selector) => createForm?.querySelector(selector);

  const setSaving = on => {
    if (!saveCreateModal) return;
    saveCreateModal.disabled=on;
    saveCreateModal.classList.toggle('saving',on);
    saveCreateModal.innerHTML=on?`<span class="backend-spinner"></span> Đang lưu...`:`<i data-lucide="save"></i> Lưu`;
    lucide.createIcons();
  };

  async function saveB2Create(type) {
    if (!type) return;
    if (!['document','task','calendar','meeting'].includes(type)) {
      closeModal();
      showToast('Chưa nối dữ liệu', 'Chức năng này chưa được nối dữ liệu thật.');
      return;
    }
    try {
      setSaving(true);
      if (type==='document') {
        throw new Error('Vui lòng sử dụng form Văn bản D1.');
      } else if (type==='task') {
        const inputs=[...createForm.querySelectorAll('input,select,textarea')].filter(x=>x.type!=='file');
        const values=inputs.map(x=>x.value);
        const title=values[0]||'';
        if (!title.trim()) throw new Error('Bạn chưa nhập tên nhiệm vụ.');
        const ownerName=values[1]||'';
        const owner=B2.users.find(u=>(u.full_name||u.email)===ownerName);
        const priorityMap={'Bình thường':'NORMAL','Cao':'HIGH','Khẩn':'URGENT'};

        await gasCall('apiCreateTask',{
          title,
          owner_user_id:owner?.user_id||B2.user?.userId||'',
          collaborator_ids:'',
          priority:priorityMap[values[3]]||'NORMAL',
          due_date:values[4]||'',
          description:values[5]||'',
          source_type:window.D1DocumentTaskSource ? 'DOCUMENT' : (window.C2DraftTaskSource ? 'DRAFT' : (window.B3MeetingTaskSource ? 'MEETING' : '')),
          source_id:window.D1DocumentTaskSource || window.C2DraftTaskSource || window.B3MeetingTaskSource || ''
        });

        window.B3MeetingTaskSource='';
        window.C2DraftTaskSource='';
        window.D1DocumentTaskSource='';
      } else if (type==='calendar') {
        const inputs=[...createForm.querySelectorAll('input,select,textarea')].filter(x=>x.type!=='file');
        const values=inputs.map(x=>x.value);
        const title=values[0]||'';
        if(!title.trim()) throw new Error('Bạn chưa nhập tên lịch công tác.');

        const groupMap={
          'Lịch chung':'GENERAL',
          'Bí thư':'SECRETARY',
          'Phó Bí thư':'DEPUTY_SECRETARY',
          'Văn phòng':'OFFICE'
        };

        await gasCall('apiCreateCalendarEvent',{
          title,
          event_date:values[1]||'',
          start_time:values[2]||'',
          end_time:values[3]||'',
          calendar_group:groupMap[values[4]]||'GENERAL',
          location:values[5]||'',
          description:values[6]||''
        });
      } else if (type==='meeting') {
        const inputs=[...createForm.querySelectorAll('input,select,textarea')].filter(x=>x.type!=='file');
        const values=inputs.map(x=>x.value);
        const fileInput=createForm.querySelector('input[type="file"]');
        const attachment=await readFileAsBase64(fileInput?.files?.[0]||null);
        const title=values[0]||'';
        if(!title.trim()) throw new Error('Bạn chưa nhập tên cuộc họp.');

        await gasCall('apiCreateMeeting',{
          title,
          meeting_date:values[1]||'',
          start_time:values[2]||'',
          chairperson:values[3]||'',
          location:values[4]||'',
          agenda:values[5]||'',
          meeting_type:'Khác',
          attachment
        });
      }
      closeModal();
      await refreshB2();
      const successMessage={
        document:'Văn bản đã được lưu vào Google Sheets/Drive.',
        task:'Nhiệm vụ đã được lưu vào Google Sheets.',
        calendar:'Lịch công tác đã được lưu vào Google Sheets.',
        meeting:'Cuộc họp đã được lưu và tự động thêm vào lịch công tác.'
      }[type] || 'Dữ liệu đã được lưu.';
      showToast('Đã lưu thành công', successMessage);
    } catch(err) {
      showToast('Không thể lưu', err.message||String(err));
    } finally { setSaving(false); }
  }


  // =========================
  // B3 - Calendar + Meetings
  // =========================
  let calendarAnchor = new Date(2026, 8, 17);
  let meetingFilter = 'upcoming';

  const startOfWeek = date => {
    const d=new Date(date);
    const day=(d.getDay()+6)%7;
    d.setHours(0,0,0,0);
    d.setDate(d.getDate()-day);
    return d;
  };

  const addDays = (date,n) => {
    const d=new Date(date);
    d.setDate(d.getDate()+n);
    return d;
  };

  const dateKeyLocal = d =>
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  const isoWeekNumber = d => {
    const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    const dayNum=x.getUTCDay()||7;
    x.setUTCDate(x.getUTCDate()+4-dayNum);
    const yearStart=new Date(Date.UTC(x.getUTCFullYear(),0,1));
    return Math.ceil((((x-yearStart)/86400000)+1)/7);
  };

  const timeToMinutes = t => {
    const m=String(t||'').match(/^(\d{1,2}):(\d{2})/);
    return m ? Number(m[1])*60+Number(m[2]) : 7*60;
  };

  const eventClassByGroup = group => ({
    GENERAL:'red-event',
    SECRETARY:'blue-event',
    DEPUTY_SECRETARY:'green-event',
    OFFICE:'purple-event'
  }[group] || 'blue-event');

  const enabledCalendarGroups = () =>
    [...document.querySelectorAll('[data-calendar-group]')]
      .filter(x=>x.checked)
      .map(x=>x.dataset.calendarGroup);

  function renderCalendarB3() {
    const header=document.getElementById('calendarWeekHeader');
    const body=document.getElementById('calendarWeekBody');
    if(!header||!body) return;

    const monday=startOfWeek(calendarAnchor);
    const sunday=addDays(monday,6);
    const weekdays=['T2','T3','T4','T5','T6','T7','CN'];

    const title=document.getElementById('calendarRangeTitle');
    if(title) {
      const sameMonth=monday.getMonth()===sunday.getMonth();
      title.textContent=sameMonth
        ? `${monday.getDate()} – ${sunday.getDate()} tháng ${monday.getMonth()+1}, ${monday.getFullYear()}`
        : `${monday.getDate()}/${monday.getMonth()+1} – ${sunday.getDate()}/${sunday.getMonth()+1}/${sunday.getFullYear()}`;
    }
    const wk=document.getElementById('calendarWeekNumber');
    if(wk) wk.textContent=`Tuần ${isoWeekNumber(monday)}`;

    const todayKey=dateKeyLocal(new Date());

    header.innerHTML=`<div class="time-head"></div>`+
      weekdays.map((w,i)=>{
        const d=addDays(monday,i);
        return `<div class="${dateKeyLocal(d)===todayKey?'today-col':''}">
          <span>${w}</span><strong>${d.getDate()}</strong>
        </div>`;
      }).join('');

    const enabled=enabledCalendarGroups();
    const weekEvents=(B2.calendarEvents||[]).filter(e=>{
      if(!enabled.includes(e.calendar_group||'GENERAL')) return false;
      const k=String(e.event_date||'').slice(0,10);
      return k>=dateKeyLocal(monday)&&k<=dateKeyLocal(sunday);
    });

    const times=Array.from({length:11},(_,i)=>`${String(i+7).padStart(2,'0')}:00`);
    let bodyHtml=`<div class="time-column">${times.map(t=>`<span>${t}</span>`).join('')}</div>`;

    for(let i=0;i<7;i++){
      const day=addDays(monday,i);
      const k=dateKeyLocal(day);
      const events=weekEvents.filter(e=>String(e.event_date||'').slice(0,10)===k);

      let col=`<div class="day-column ${k===todayKey?'today-column-bg':''}">`;
      if(k===todayKey){
        const now=new Date();
        const min=now.getHours()*60+now.getMinutes();
        if(min>=7*60&&min<=18*60){
          const top=(min-7*60)/60*50;
          col+=`<div class="current-time-line" style="top:${top}px"><span></span></div>`;
        }
      }

      events.forEach(e=>{
        const start=timeToMinutes(e.start_time);
        const end=e.end_time ? timeToMinutes(e.end_time) : start+60;
        const top=Math.max(0,(start-7*60)/60*50);
        const height=Math.max(38,(end-start)/60*50);
        col+=`<div class="cal-event ${eventClassByGroup(e.calendar_group)} b3-event-detail"
          data-id="${esc(e.event_id)}" style="top:${top}px;height:${height}px">
          <strong>${esc(e.title)}</strong>
          <span>${esc(e.start_time||'')} ${e.location?'· '+esc(e.location):''}</span>
        </div>`;
      });

      col+=`</div>`;
      bodyHtml+=col;
    }

    body.innerHTML=bodyHtml;
    lucide.createIcons();
  }

  const meetingDateTime = m => {
    const raw=`${String(m.meeting_date||'').slice(0,10)}T${m.start_time||'00:00'}`;
    const d=new Date(raw);
    return isNaN(d)?new Date(0):d;
  };

  const meetingStatusLabel = m => {
    const dt=meetingDateTime(m);
    const now=new Date();
    if(m.status==='COMPLETED') return ['Đã hoàn thành','status-success'];
    if(dt<now) return ['Đã diễn ra','status-new'];

    const today=dateKeyLocal(now);
    if(String(m.meeting_date||'').slice(0,10)===today) return ['Hôm nay · '+(m.start_time||''),'status-warning'];
    return [m.start_time||'Sắp diễn ra','status-new'];
  };

  function renderMeetingsB3() {
    const box=document.getElementById('meetingCards');
    if(!box) return;

    const now=new Date();
    const all=B2.meetings||[];
    const upcoming=all.filter(m=>meetingDateTime(m)>=now && m.status!=='COMPLETED');
    const past=all.filter(m=>meetingDateTime(m)<now || m.status==='COMPLETED');

    const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
    set('meetingUpcomingCount',upcoming.length);
    set('meetingPastCount',past.length);

    let list=meetingFilter==='past'?past:meetingFilter==='all'?all:upcoming;

      box.innerHTML=`<div class="panel empty-data" style="min-height:260px">

        <strong>Chưa có cuộc họp trong nhóm này</strong>

        return `<article class="meeting-card ${idx===0&&meetingFilter!=='past'?'featured':''} meeting-real-card b3-meeting-detail" data-id="${esc(m.meeting_id)}">
          <div class="meeting-date ${idx===0&&meetingFilter!=='past'?'red-date':''}">
            <strong>${isNaN(d)?'—':String(d.getDate()).padStart(2,'0')}</strong>
            <span>${isNaN(d)?'':('THÁNG '+(d.getMonth()+1))}</span>

          <div class="meeting-info">
            <div class="meeting-title-row"><span class="status ${status[1]}">${esc(status[0])}</span><span class="meeting-type">${esc(m.meeting_type||'Cuộc họp')}</span></div>
            <h2>${esc(m.title)}</h2>
            <p>${esc(m.agenda||'Chưa nhập nội dung dự kiến.')}</p>
            <div class="meeting-meta">
              <span><i data-lucide="map-pin"></i> ${esc(m.location||'Chưa xác định')}</span>
              <span><i data-lucide="user-round"></i> ${esc(m.chairperson||'Chưa xác định')}</span>
              <span><i data-lucide="list-checks"></i> ${linked} nhiệm vụ</span>
            </div>
          </div>
          <div class="meeting-action">
            <button class="btn btn-light btn-sm">Mở hồ sơ</button>
            <button class="icon-btn"><i data-lucide="more-horizontal"></i></button>
          </div>
        </article>`;
      }).join('');
    }

    renderMeetingSideB3(upcoming[0]||all[0]||null);
    lucide.createIcons();
  }

  function renderMeetingSideB3(m) {
    const side=document.getElementById('meetingSidePanel');
    if(!side) return;
    if(!m){
      side.innerHTML=`<div class="panel-head"><div><h2>Cuộc họp gần nhất</h2><p>Chưa có dữ liệu</p></div><span class="meeting-ring">—</span></div>
        <div class="empty-data"><i data-lucide="calendar-days"></i><strong>Chưa có cuộc họp</strong><span>Tạo cuộc họp để bắt đầu.</span></div>`;
      return;
    }
    const linked=m.linked_tasks||[];

    ['WAITING_APPROVAL','Chờ duyệt'],

  const historyActionLabelD1 = action => ({
    CREATE:'Tiếp nhận văn bản',
    UPDATE_INFO:'Cập nhật thông tin',
    UPDATE_PROCESSING:'Cập nhật xử lý',
    ADD_FILE:'Thêm tài liệu',
    NOTE:'Ghi chú xử lý',
    ARCHIVE:'Lưu trữ hồ sơ',
    CREATE_TASK:'Tạo nhiệm vụ'
  }[action] || action || 'Cập nhật');

  const priorityLabelD1 = p => ({
    NORMAL:'Bình thường',
    HIGH:'Cao',
    URGENT:'Khẩn'
  }[p] || p || 'Bình thường');

  const formatInputDateD1 = value => {
    if(!value) return '';
    const d=new Date(value);
    if(isNaN(d)) return String(value).slice(0,10);
    const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  };

  const formatInputDateTimeD1 = value => {
    if(!value) return '';
    const d=new Date(value);
    if(isNaN(d)) return String(value).slice(0,16);
    const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
    const hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');
    return `${y}-${m}-${day}T${hh}:${mm}`;
  };

  function populateSelectD1(id,items,currentValue,allLabel){
    const el=document.getElementById(id);
    if(!el) return;
    const current=currentValue ?? el.value;
    el.innerHTML=(allLabel!==undefined?`<option value="ALL">${esc(allLabel)}</option>`:'')+
      items.map(i=>`<option value="${esc(i.value)}">${esc(i.label)}</option>`).join('');
    if([...el.options].some(o=>o.value===current)) el.value=current;
  }

  function renderDocumentPaginationD1(p){
    const box=document.getElementById('documentPagination');
    if(!box) return;

    const pages=[];
    const start=Math.max(1,p.page-2);
    const end=Math.min(p.pages,p.page+2);
    for(let i=start;i<=end;i++) pages.push(i);

    box.innerHTML=`
      <button ${p.page<=1?'disabled':''} data-page="${p.page-1}"><i data-lucide="chevron-left"></i></button>
      ${pages.map(n=>`<button class="${n===p.page?'active':''}" data-page="${n}">${n}</button>`).join('')}
      <button ${p.page>=p.pages?'disabled':''} data-page="${p.page+1}"><i data-lucide="chevron-right"></i></button>`;

  }

  function validateFilesD1(files){
    const arr=[...files];
    if(arr.length>5) throw new Error('Mỗi lần chỉ chọn tối đa 5 tệp.');
    const tooLarge=arr.find(f=>f.size>20*1024*1024);
    if(tooLarge) throw new Error(`${tooLarge.name} vượt quá 20 MB.`);
    return arr;

  async function saveDocumentD1(){
    const title=document.getElementById('d1DocTitle')?.value.trim()||'';
    if(!title){showToast('Thiếu thông tin','Bạn chưa nhập trích yếu văn bản.');return;}

    const payload={
      title,
      document_no:document.getElementById('d1DocNo')?.value||'',
      direction:document.getElementById('d1DocDirection')?.value||'INCOMING',
      document_type:document.getElementById('d1DocType')?.value||'',
      issuer:document.getElementById('d1DocIssuer')?.value||'',
      issued_date:document.getElementById('d1DocIssuedDate')?.value||'',
      received_date:document.getElementById('d1DocReceivedDate')?.value||'',
      field:document.getElementById('d1DocField')?.value||'',
      priority:document.getElementById('d1DocPriority')?.value||'NORMAL',
      assignee_user_id:document.getElementById('d1DocAssignee')?.value||'',
      due_date:document.getElementById('d1DocDueDate')?.value||'',
      summary:document.getElementById('d1DocSummary')?.value||'',
      notes:document.getElementById('d1DocNotes')?.value||''
    };

    const btn=document.getElementById('d1SaveDocument');
    btn.disabled=true;
    btn.innerHTML='<span class="backend-spinner"></span> Đang lưu...';

    try{
      let saved;
      if(D1.editingId){
        saved=await gasCall('apiD1UpdateDocument',D1.editingId,payload);
      }else{
        saved=await gasCall('apiD1CreateDocument',payload);
      }

      if(D1.selectedFiles.length){
        await uploadFilesD1(saved.document_id,D1.selectedFiles);
      }

      closeDocumentModalD1();
      await refreshB2();
      await loadDocumentsD1();

      showToast(
        'Đã lưu văn bản',
        D1.selectedFiles.length
          ? `Đã lưu hồ sơ và ${D1.selectedFiles.length} tài liệu lên Google Drive.`
          : 'Thông tin văn bản đã được cập nhật.'
      );

      if(D1.editingId) await openDocumentD1(saved.document_id);
    }catch(err){
      showToast('Không thể lưu văn bản',err.message||String(err));
    }finally{
      btn.disabled=false;
      btn.innerHTML='<i data-lucide="save"></i> Lưu hồ sơ';
      lucide.createIcons();
    }
  }

  function historyDescriptionD1(h){
    const d=h.detail||{};
    if(h.action==='CREATE') return `Tạo hồ sơ ${d.document_no||''} · trạng thái ${d.status||'NEW'}`;
    if(h.action==='UPDATE_INFO') return 'Cập nhật thông tin hồ sơ văn bản.';
    if(h.action==='UPDATE_PROCESSING'){
      const bits=[];
      if(d.from_status!==d.to_status) bits.push(`${statusMeta(d.from_status)[0]} → ${statusMeta(d.to_status)[0]}`);
      if(d.from_assignee!==d.to_assignee) bits.push('thay đổi người xử lý');
      if(d.to_due_date) bits.push(`hạn ${formatDateTimeVN(d.to_due_date)}`);
      if(d.note) bits.push(d.note);
      return bits.join(' · ')||'Cập nhật xử lý.';
    }
    if(h.action==='ADD_FILE') return `Thêm tệp ${d.file_name||''}`;
    if(h.action==='NOTE') return d.note||'Ghi chú xử lý';
    if(h.action==='ARCHIVE') return d.note?`Lưu trữ · ${d.note}`:'Đưa hồ sơ vào lưu trữ.';
    if(h.action==='CREATE_TASK') return `Tạo nhiệm vụ: ${d.title||d.task_id||''}`;
    return 'Cập nhật hồ sơ.';
  }

  const humanSize = bytes => {
    const n=Number(bytes||0);
    if(!n) return '0 KB';
    const units=['B','KB','MB','GB'];
    let i=0,v=n;
    while(v>=1024&&i<units.length-1){v/=1024;i++}
    return `${v>=10||i===0?v.toFixed(0):v.toFixed(1)} ${units[i]}`;
  };

  const fileKind = mime => {
    const m=String(mime||'').toLowerCase();
    if(m.includes('pdf')) return ['PDF','pdf-preview','file-text'];
    if(m.includes('word')||m.includes('document')) return ['DOCX','word-preview','file-text'];
    if(m.includes('sheet')||m.includes('excel')||m.includes('spreadsheet')) return ['XLSX','sheet-preview','sheet'];
    if(m.includes('image')) return ['IMG','blue-soft','image'];
    return ['FILE','purple-soft','file'];
  };

        ? data.folders.map(f=>`
          <article class="folder-card repo-item-open" data-folder-id="${esc(f.id)}">

    }

    if(fileGrid){
      fileGrid.innerHTML=data.files.length
        ? data.files.map(f=>{
          const k=fileKind(f.mimeType);
          return `<article class="file-card repo-file-open" data-url="${esc(f.url)}">

    const rows=[

      ...data.files.map(f=>{

      showToast('Đã tạo thư mục','Thư mục mới đã được tạo trên Google Drive.');

    }
  }

  async function uploadRepoFileB4(file){
    if(!file) return;
    try{
      showToast('Đang tải lên',file.name);
      const encoded=await readFileAsBase64(file);
      await gasCall('apiB4UploadRepositoryFile',B4.repoFolderId||'',encoded);
      await loadRepositoryB4(B4.repoFolderId||'');
      showToast('Tải lên thành công',`${file.name} đã được lưu vào Google Drive.`);
    }catch(err){
      showToast('Không thể tải tệp',err.message||String(err));
    }
  }

  function renderReportB4(){
    const r=B4.report;
    if(!r) return;
    const s=r.stats;
    const total=Math.max(1,Number(s.totalTasks||0));
    const pct=n=>Math.round((Number(n||0)/total)*100);

    const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val};
    set('reportTotalTasks',s.totalTasks||0);
    set('reportCompletedTasks',s.completed||0);
    set('reportInProgressTasks',s.inProgress||0);
    set('reportOverdueTasks',s.overdue||0);
    set('reportTotalHint',`${s.totalDocuments||0} văn bản trong hệ thống`);
    set('reportCompletedHint',`${pct(s.completed)}% tổng nhiệm vụ`);
    set('reportProgressHint',`${pct(s.inProgress)}% tổng nhiệm vụ`);
    set('reportOverdueHint',s.overdue?`${s.overdue} nhiệm vụ cần chú ý`:'Không có nhiệm vụ quá hạn');

    const groups=document.getElementById('reportBarGroups');
    if(groups){
      const max=Math.max(1,...r.months.flatMap(m=>[m.completed,m.processing,m.overdue]));
      groups.innerHTML=r.months.map((m,i)=>{
        const h=v=>Math.max(5,Math.round((Number(v||0)/max)*145));
        return `<div class="bar-group ${i===r.months.length-1?'current':''}">
          <div>
            <i class="bar-done" style="height:${h(m.completed)}px" title="${m.completed} hoàn thành"></i>
            <i class="bar-doing" style="height:${h(m.processing)}px" title="${m.processing} đang xử lý"></i>
            <i class="bar-overdue" style="height:${h(m.overdue)}px" title="${m.overdue} quá hạn"></i>
          </div><span>${esc(m.label)}</span>
        </div>`;
      }).join('');
    }

    const completedPct=pct(s.completed);
    const progressPct=pct(s.inProgress);
    const overduePct=Math.max(0,100-completedPct-progressPct);
    const donut=document.getElementById('reportDonut');
    if(donut){
      donut.style.background=`conic-gradient(#16A34A 0 ${completedPct}%,#2563EB ${completedPct}% ${completedPct+progressPct}%,#DC2626 ${completedPct+progressPct}% 100%)`;
    }
    set('reportDonutTotal',s.totalTasks||0);

    const breakdown=document.getElementById('reportBreakdown');
    if(breakdown){
      breakdown.innerHTML=`
        <div><span><i class="legend-dot done"></i> Hoàn thành</span><strong>${s.completed||0} <small>${completedPct}%</small></strong></div>
        <div><span><i class="legend-dot doing"></i> Đang thực hiện</span><strong>${s.inProgress||0} <small>${progressPct}%</small></strong></div>
        <div><span><i class="legend-dot overdue"></i> Quá hạn</span><strong>${s.overdue||0} <small>${pct(s.overdue)}%</small></strong></div>`;
    }

    const attention=document.getElementById('reportAttentionList');
    if(attention){
      attention.innerHTML=r.attention.length?r.attention.map(t=>{
        const st=statusMeta(t.effective_status||t.status);
        const overdue=(t.effective_status||t.status)==='OVERDUE';
        return `<div class="b2-task-detail" data-id="${esc(t.task_id)}">
          <span class="attention-status ${overdue?'overdue-att':'due-att'}"><i data-lucide="${overdue?'circle-alert':'clock-3'}"></i></span>
          <div><strong>${esc(t.title)}</strong><small>${esc(t.owner_name||userName(t.owner_user_id)||'Chưa giao')} · ${formatDateTimeVN(t.due_date)}</small></div>
          <span class="status ${st[1]}">${st[0]}</span>
        </div>`;
      }).join(''):`<div class="empty-data"><i data-lucide="circle-check-big"></i><strong>Không có nhiệm vụ cần chú ý</strong><span>Tiến độ hiện tại đang ổn.</span></div>`;
    }

    document.querySelector('.report-updated')?.replaceChildren();
    const updated=document.querySelector('.report-updated');
    if(updated){
      updated.className='report-updated report-live-badge';
      updated.textContent='Dữ liệu thật · '+new Intl.DateTimeFormat('vi-VN',{hour:'2-digit',minute:'2-digit'}).format(new Date(r.generatedAt));
    }
    lucide.createIcons();
  }

  const hasPermissionB5 = permission => {
    const perms=B2.user?.permissions||[];
    return perms.includes('*') || perms.includes(permission);

  function applyAccessB5(){
    if(!B2.user) return;
    const role=B2.user.role||'';

    const pagePermission={
      dashboard:'dashboard.view',
      documents:'documents.view',
      tasks:'tasks.view',
      calendar:'calendar.view',
      meetings:'meetings.view',
      advisory:'advisory.use',
      reports:'reports.view',
      repository:'repository.view'
    };

    document.querySelectorAll('.nav-item[data-page]').forEach(item=>{
      const page=item.dataset.page;
      let allowed=true;
      if(page==='admin') allowed=role==='ADMIN';
      else if(page==='tools') allowed=role==='ADMIN'||role==='OFFICE'||hasPermissionB5('advisory.use');
      else if(pagePermission[page]) allowed=hasPermissionB5(pagePermission[page]);
      item.classList.toggle('access-hidden',!allowed);
    });

    const controlRules=[
      ['.open-create-modal[data-type="document"]','documents.create'],
      ['#btnNewDocument','documents.create'],
      ['.open-create-modal[data-type="task"]','tasks.create'],
      ['.open-create-modal[data-type="calendar"]','calendar.create'],
      ['.open-create-modal[data-type="meeting"]','meetings.create'],
      ['.repo-upload','repository.upload'],
      ['.repo-new-folder','repository.upload'],
      ['.report-generate','reports.create']
    ];

    controlRules.forEach(([selector,permission])=>{
      document.querySelectorAll(selector).forEach(el=>{
        el.classList.toggle('access-hidden',!hasPermissionB5(permission));
      });
    });

    const quick=document.getElementById('quickCreate');
    if(quick){
      const canCreate=[
        'documents.create','tasks.create','calendar.create','meetings.create'
      ].some(hasPermissionB5);
      quick.classList.toggle('access-hidden',!canCreate);
    }

    document.getElementById('aiConfigBtn')?.classList.toggle('access-hidden',role!=='ADMIN');

    document.getElementById('documentCreateBtn')?.classList.toggle('access-hidden',!hasPermissionB5('documents.create'));
    document.getElementById('documentImportBtn')?.classList.toggle('access-hidden',!hasPermissionB5('documents.create'));

    const displayRole=roleLabelsB5[role]||role;
    document.querySelectorAll('.profile-text span,.sidebar-user-info span')
      .forEach(el=>el.textContent=displayRole);
  }

  function filteredAdminUsersB5(){
    if(!B5.admin) return [];
    const q=(document.getElementById('adminUserSearch')?.value||'').trim().toLowerCase();

    return (B5.admin.users||[]).filter(u=>{
      const searchOk=!q ||
        String(u.full_name||'').toLowerCase().includes(q) ||
        String(u.email||'').toLowerCase().includes(q) ||
        String(u.department_name||'').toLowerCase().includes(q);

      const roleOk=B5.roleFilter==='ALL'||u.role===B5.roleFilter;
      const statusOk=B5.statusFilter==='ALL'||u.status===B5.statusFilter;
      return searchOk&&roleOk&&statusOk;

  const notificationTypeMetaB6 = type => ({
    TASK_ASSIGNED:['blue-dot','list-checks'],
    TASK_DUE_SOON:['amber-dot','clock-3'],
    TASK_OVERDUE:['red-dot','circle-alert'],
    DOCUMENT_DUE_SOON:['purple-dot','file-clock'],
    MEETING_UPCOMING:['green-dot','calendar-clock']
  }[type] || ['blue-dot','bell']);

  const relativeTimeB6 = value => {
    if(!value) return '';
    const d=new Date(value);
    if(isNaN(d)) return '';
    const diff=Math.max(0,Date.now()-d.getTime());
    const min=Math.floor(diff/60000);
    if(min<1) return 'Vừa xong';
    if(min<60) return `${min} phút`;
    const hour=Math.floor(min/60);
    if(hour<24) return `${hour} giờ`;
    const day=Math.floor(hour/24);
    if(day<7) return `${day} ngày`;
    return formatDateVN(value);
  };

  async function submitAdvisory() {
    const text = advisoryPrompt?.value.trim();
    if (!text) return;

    const thinking=addChat(

      sendAdvisory.innerHTML='<span class="backend-spinner"></span> Đang xử lý';

    try{

        prompt:text,
        taskType:C1.taskType,
        fileIds:C1.selectedFiles.map(f=>f.id)
      });

      thinking?.remove();

      const outputId='c2_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
      C2.outputs[outputId]={
        outputId,

        prompt:text,
        taskType:C1.taskType,
        files:[...C1.selectedFiles],
        draftId:'',
        sourceType:'',
        sourceId:'',
        driveUrl:'',
        modelUsed:result.modelUsed||C1.config?.model||''

    SUMMARY:'Tóm tắt',
    REVIEW:'Rà soát',
    CONCLUSION:'Thông báo kết luận',
    REPORT:'Báo cáo'
  }[type] || type || 'Tham mưu');

  function renderAiResultActionsC2(outputId){
    const output=C2.outputs[outputId];
    if(!output) return '';

    return `<div class="ai-result-actions" data-output-id="${esc(outputId)}">
      <button class="ai-result-action primary c2-save-draft" data-id="${esc(outputId)}">
        <i data-lucide="save"></i> Lưu bản nháp
      </button>
      <button class="ai-result-action c2-export-doc" data-id="${esc(outputId)}">
        <i data-lucide="file-output"></i> Xuất Google Docs
      </button>
      <button class="ai-result-action c2-link-source" data-id="${esc(outputId)}">
        <i data-lucide="link-2"></i> Gắn vào hồ sơ
      </button>
      ${output.taskType==='CONCLUSION'?`
        <button class="ai-result-action c2-create-task" data-id="${esc(outputId)}">
          <i data-lucide="list-plus"></i> Tạo nhiệm vụ
        </button>`:''}
      <button class="ai-result-action c2-copy-output" data-id="${esc(outputId)}">
        <i data-lucide="copy"></i> Sao chép
      </button>
      <div class="ai-result-status" id="c2Status_${esc(outputId)}">
        ${output.modelUsed?`Model: <strong>${esc(output.modelUsed)}</strong>`:''}
      </div>
    </div>`;
  }

  function draftTitleC2(output){
    const first=(output.text||'').split('\n').map(x=>x.trim()).find(Boolean)||'';
    const clean=first.replace(/^#+\s*/,'').replace(/[*_`]/g,'').trim();
    if(clean && clean.length<=130) return clean;
    return `${draftTypeLabelC2(output.taskType)} - ${new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date())}`;
  }

  function setOutputStatusC2(outputId,text){
    const el=document.getElementById(`c2Status_${outputId}`);
    if(el) el.innerHTML=text;
  }

  async function ensureSavedDraftC2(outputId){
    const output=C2.outputs[outputId];
    if(!output) throw new Error('Không tìm thấy kết quả AI.');

    const saved=await gasCall('apiC2SaveDraft',{
      draft_id:output.draftId||'',
      draft_type:output.taskType,
      title:draftTitleC2(output),
      content:output.text,
      source_type:output.sourceType||'',
      source_id:output.sourceId||''
    });

    output.draftId=saved.draft_id;
    output.sourceType=saved.source_type||'';
    output.sourceId=saved.source_id||'';
    output.driveUrl=saved.drive_url||output.driveUrl||'';

    setOutputStatusC2(
      outputId,
      `Đã lưu bản nháp · phiên bản <strong>${saved.version}</strong>${saved.drive_url?' · <strong>đã xuất Docs</strong>':''}`
    );

    return saved;
  }

  async function exportOutputC2(outputId){
    try{
      const saved=await ensureSavedDraftC2(outputId);
      setOutputStatusC2(outputId,'Đang tạo Google Docs...');
      const exported=await gasCall('apiC2ExportDraftToGoogleDoc',saved.draft_id);
      const output=C2.outputs[outputId];
      output.driveUrl=exported.drive_url||'';

      setOutputStatusC2(
        outputId,
        `Đã xuất Google Docs · <a href="${esc(exported.drive_url)}" target="_blank">Mở tài liệu</a>`
      );

      if(exported.drive_url) window.open(exported.drive_url,'_blank','noopener');
    }catch(err){
      showToast('Không thể xuất Google Docs',err.message||String(err));
    }
  }

  function populateDraftLinkSourcesC2(){
    const type=document.getElementById('draftLinkType')?.value||'DOCUMENT';
    const select=document.getElementById('draftLinkSource');
    if(!select) return;

    if(type==='DOCUMENT'){
      select.innerHTML=(B2.documents||[]).map(d=>
        `<option value="${esc(d.document_id)}">${esc((d.document_no||'—')+' · '+d.title)}</option>`
      ).join('') || '<option value="">Chưa có văn bản</option>';
    }else{
      select.innerHTML=(B2.meetings||[]).map(m=>
        `<option value="${esc(m.meeting_id)}">${esc(formatDateVN(m.meeting_date)+' · '+m.title)}</option>`
      ).join('') || '<option value="">Chưa có cuộc họp</option>';
    }
  }

  async function openDraftLinkC2(outputId){
    try{
      await ensureSavedDraftC2(outputId);
      C2.activeLinkOutputId=outputId;
      populateDraftLinkSourcesC2();
      document.getElementById('draftLinkModal')?.classList.add('show');
      lucide.createIcons();
    }catch(err){
      showToast('Không thể lưu bản nháp',err.message||String(err));
    }
  }

  async function saveDraftLinkC2(){
    const output=C2.outputs[C2.activeLinkOutputId];
    if(!output?.draftId) return;

    const type=document.getElementById('draftLinkType')?.value||'DOCUMENT';
    const sourceId=document.getElementById('draftLinkSource')?.value||'';
    if(!sourceId){
      showToast('Chưa chọn hồ sơ','Bạn cần chọn Văn bản hoặc Cuộc họp.');
      return;
    }

    try{
      const linked=await gasCall('apiC2LinkDraft',output.draftId,type,sourceId);
      output.sourceType=linked.source_type||type;
      output.sourceId=linked.source_id||sourceId;
      document.getElementById('draftLinkModal')?.classList.remove('show');
      setOutputStatusC2(C2.activeLinkOutputId,`Đã gắn vào hồ sơ <strong>${esc(type==='DOCUMENT'?'Văn bản':'Cuộc họp')}</strong>`);
      showToast('Đã liên kết','Bản nháp đã được gắn vào hồ sơ.');
    }catch(err){
      showToast('Không thể liên kết',err.message||String(err));
    }
  }

  async function createTaskFromOutputC2(outputId){
    const output=C2.outputs[outputId];
    if(!output) return;

    try{
      const saved=await ensureSavedDraftC2(outputId);
      window.C2DraftTaskSource=saved.draft_id;
      openModal('task');

      setTimeout(()=>{
        const fields=[...createForm.querySelectorAll('input,select,textarea')].filter(x=>x.type!=='file');
        if(fields[0]) fields[0].value=`Thực hiện kết luận: ${draftTitleC2(output)}`.slice(0,180);
        if(fields[5]) fields[5].value=output.text;
      },30);
    }catch(err){
      showToast('Không thể tạo nhiệm vụ',err.message||String(err));
    }
  }

  async function loadDraftHistoryC2(){
    const list=document.getElementById('draftHistoryList');
    if(!list) return;

    list.innerHTML=`<div class="notif-loading"><span class="backend-spinner"></span><span>Đang tải bản nháp...</span></div>`;
    document.getElementById('draftHistoryModal')?.classList.add('show');

    try{
      C2.history=await gasCall('apiC2ListDrafts')||[];

      list.innerHTML=C2.history.length?C2.history.map(d=>`
        <div class="draft-history-item c2-history-open" data-id="${esc(d.draft_id)}">
          <span class="draft-history-icon"><i data-lucide="file-pen-line"></i></span>
          <div class="draft-history-main">
            <strong>${esc(d.title||'Bản nháp')}</strong>
            <div class="draft-history-meta">
              <span class="status ${d.status==='EXPORTED'?'status-success':'status-new'}">${d.status==='EXPORTED'?'Đã xuất Docs':'Bản nháp'}</span>
              <small>${esc(draftTypeLabelC2(d.draft_type))} · v${d.version} · ${formatDateTimeVN(d.updated_at)}</small>
            </div>
          </div>
          <div class="draft-history-actions">
            ${d.drive_url?`<a class="icon-btn" href="${esc(d.drive_url)}" target="_blank" title="Mở Google Docs"><i data-lucide="external-link"></i></a>`:''}
            <button class="icon-btn"><i data-lucide="chevron-right"></i></button>
          </div>
        </div>`).join(''):`<div class="notif-empty"><i data-lucide="file-clock"></i><strong>Chưa có bản nháp</strong><span>Kết quả AI sau khi lưu sẽ xuất hiện tại đây.</span></div>`;

      lucide.createIcons();
    }catch(err){
      list.innerHTML=`<div class="notif-empty"><i data-lucide="circle-alert"></i><strong>Không tải được lịch sử</strong><span>${esc(err.message||String(err))}</span></div>`;
      lucide.createIcons();
    }
  }

  async function openHistoryDraftC2(draftId){
    try{
      const d=await gasCall('apiC2GetDraft',draftId);
      document.getElementById('draftHistoryModal')?.classList.remove('show');

      const outputId='history_'+d.draft_id;
      C2.outputs[outputId]={
        outputId,
        text:d.content_html||'',
        prompt:'',
        taskType:d.draft_type||'GENERAL',
        files:[],
        draftId:d.draft_id,
        sourceType:d.source_type||'',
        sourceId:d.source_id||'',
        driveUrl:d.drive_url||'',
        modelUsed:''
      };

      addChat(
        'assistant',
        d.content_html||'',
        {
          aiOutput:true,
          disclaimer:'Bản nháp đã lưu trong hệ thống — cần kiểm tra trước khi sử dụng.',
          actionsHtml:renderAiResultActionsC2(outputId)
        }
      );

      setOutputStatusC2(
        outputId,
        `Bản nháp v<strong>${d.version}</strong>${d.drive_url?` · <a href="${esc(d.drive_url)}" target="_blank">Mở Google Docs</a>`:''}`
      );
    }catch(err){
      showToast('Không mở được bản nháp',err.message||String(err));
    }
  }

  async function loadLinkedDraftsC2(sourceType,sourceId){
    const box=document.getElementById('c2LinkedDraftsSource');
    if(!box) return;

    try{
      const rows=await gasCall('apiC2ListDraftsForSource',sourceType,sourceId);
      if(!document.body.contains(box)) return;

      box.innerHTML=rows.length?rows.map(d=>`
        <div class="linked-draft-row c2-linked-open" data-id="${esc(d.draft_id)}">
          <span><i data-lucide="file-pen-line"></i></span>
          <div>
            <strong>${esc(d.title)}</strong>
            <small>${esc(draftTypeLabelC2(d.draft_type))} · v${d.version} · ${formatDateTimeVN(d.updated_at)}</small>
          </div>
          <div class="linked-draft-actions">
            ${d.drive_url?`<a class="icon-btn" href="${esc(d.drive_url)}" target="_blank"><i data-lucide="external-link"></i></a>`:''}
            <button class="icon-btn"><i data-lucide="chevron-right"></i></button>
          </div>
        </div>`).join(''):`<div class="empty-data" style="min-height:75px"><strong>Chưa có bản nháp liên kết</strong><span>Từ Trợ lý tham mưu, dùng nút “Gắn vào hồ sơ”.</span></div>`;

      lucide.createIcons();
    }catch(err){
      if(document.body.contains(box)){
        box.innerHTML=`<span style="font-size:8px;color:#94A3B8">Không tải được bản nháp liên kết.</span>`;
      }
    }
  }

  document.getElementById('advisoryHistoryBtn')?.addEventListener('click',loadDraftHistoryC2);
  document.querySelectorAll('.draft-history-close').forEach(btn=>btn.addEventListener('click',()=>{
    document.getElementById('draftHistoryModal')?.classList.remove('show');
  }));
  document.querySelectorAll('.draft-link-close').forEach(btn=>btn.addEventListener('click',()=>{
    document.getElementById('draftLinkModal')?.classList.remove('show');
  }));
  document.getElementById('draftLinkType')?.addEventListener('change',populateDraftLinkSourcesC2);
  document.getElementById('saveDraftLink')?.addEventListener('click',saveDraftLinkC2);

  document.addEventListener('click',async e=>{
    const save=e.target.closest('.c2-save-draft');
    if(save){
      try{
        await ensureSavedDraftC2(save.dataset.id);
        showToast('Đã lưu bản nháp','Nội dung đã được lưu vào DRAFTS.');
      }catch(err){showToast('Không thể lưu',err.message||String(err))}
      return;
    }

    const exp=e.target.closest('.c2-export-doc');
    if(exp){await exportOutputC2(exp.dataset.id);return;}

    const link=e.target.closest('.c2-link-source');
    if(link){await openDraftLinkC2(link.dataset.id);return;}

    const task=e.target.closest('.c2-create-task');
    if(task){await createTaskFromOutputC2(task.dataset.id);return;}

    const copy=e.target.closest('.c2-copy-output');
    if(copy){
      const output=C2.outputs[copy.dataset.id];
      if(output){
        try{
          await navigator.clipboard.writeText(output.text||'');
          showToast('Đã sao chép','Nội dung bản nháp đã được sao chép.');
        }catch(err){showToast('Không thể sao chép','Trình duyệt không cho phép truy cập clipboard.')}
      }
      return;
    }

    const history=e.target.closest('.c2-history-open');
    if(history && !e.target.closest('a')){await openHistoryDraftC2(history.dataset.id);return;}

    const linked=e.target.closest('.c2-linked-open');
    if(linked && !e.target.closest('a')){
      closeDrawer();
      await openHistoryDraftC2(linked.dataset.id);
    }
  });



  // Reports
  document.querySelectorAll('.report-period .segment').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.report-period .segment').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    showToast('Đã đổi kỳ báo cáo', `Đang xem dữ liệu theo ${btn.textContent.toLowerCase()}.`);
  }));
  document.querySelectorAll('.report-generate').forEach(btn => btn.addEventListener('click', async () => {
    await loadReportB4();
    showToast('Đã cập nhật báo cáo', 'Số liệu đã được tổng hợp lại từ dữ liệu thật.');
  }));
  document.getElementById('reportToTasks')?.addEventListener('click', () => {
    document.querySelector('.nav-item[data-page="tasks"]')?.click();
  });

  // Repository
  document.querySelectorAll('[data-repo-view]').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('[data-repo-view]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const list = btn.dataset.repoView === 'list';
    document.getElementById('repoGridView')?.classList.toggle('hidden-block', list);
    document.getElementById('repoListView')?.classList.toggle('hidden-block', !list);
    lucide.createIcons();
  }));
  bindSearch('repoSearch', '#repoFileGrid .file-card');

  // Tool modal
  const toolModal = document.getElementById('toolModal');
  const toolModalTitle = document.getElementById('toolModalTitle');
  const toolModalBody = document.getElementById('toolModalBody');
  const runToolAction = document.getElementById('runToolAction');

  const toolTitles = {
    compare:'So sánh văn bản', ocr:'OCR tài liệu', summary:'Tóm tắt tài liệu', proofread:'Kiểm tra văn bản',
    draft:'Soạn văn bản', speech:'Gợi ý bài phát biểu', report:'Tổng hợp báo cáo', voice:'Văn bản → giọng nói'
  };

  const toolBodies = {
    compare: `<div class="tool-workspace"><label class="tool-drop"><i data-lucide="file-up"></i><strong>Văn bản gốc</strong><span>Chọn DOCX, PDF hoặc TXT</span></label><label class="tool-drop"><i data-lucide="file-up"></i><strong>Văn bản cần so sánh</strong><span>Chọn phiên bản mới</span></label><div class="tool-options"><label class="tool-option"><input type="checkbox" checked><div><strong>Đánh dấu nội dung thay đổi</strong><span>Làm nổi bật phần thêm, xóa và sửa</span></div></label><label class="tool-option"><input type="checkbox" checked><div><strong>Tạo bảng tổng hợp</strong><span>Liệt kê các khác biệt chính</span></div></label></div></div>`,
    ocr: `<div class="tool-single-form"><label class="tool-drop"><i data-lucide="scan-text"></i><strong>Chọn ảnh hoặc PDF scan</strong><span>Hỗ trợ PNG, JPG, PDF</span></label><label class="tool-option"><input type="checkbox" checked><div><strong>Giữ xuống dòng cơ bản</strong><span>Phù hợp với văn bản hành chính</span></div></label></div>`,
    summary: `<div class="tool-single-form"><label class="tool-drop"><i data-lucide="file-up"></i><strong>Chọn tài liệu cần tóm tắt</strong><span>PDF, DOCX hoặc TXT</span></label><textarea placeholder="Yêu cầu thêm, ví dụ: Tóm tắt thành 5 ý để báo cáo lãnh đạo..."></textarea></div>`,
    proofread: `<div class="tool-single-form"><textarea placeholder="Dán nội dung văn bản cần kiểm tra vào đây..."></textarea><div class="tool-options"><label class="tool-option"><input type="checkbox" checked><div><strong>Chính tả & câu chữ</strong><span>Rà lỗi thường gặp</span></div></label><label class="tool-option"><input type="checkbox" checked><div><strong>Thông tin còn thiếu</strong><span>Nhắc các trường cần kiểm tra</span></div></label></div></div>`,
    draft: `<div class="tool-single-form"><textarea placeholder="Mô tả văn bản cần soạn, ví dụ: Soạn dự thảo thông báo kết luận cuộc họp..."></textarea><label class="tool-option"><input type="checkbox" checked><div><strong>Sử dụng mẫu văn bản của đơn vị</strong><span>Sang bước B sẽ đọc mẫu từ Google Drive</span></div></label></div>`,
    speech: `<div class="tool-single-form"><textarea placeholder="Nhập chủ đề, bối cảnh, đối tượng nghe và những ý chính cần nhấn mạnh..."></textarea></div>`,
    report: `<div class="tool-single-form"><textarea placeholder="Mô tả loại báo cáo cần tổng hợp..."></textarea><label class="tool-option"><input type="checkbox" checked><div><strong>Lấy dữ liệu nhiệm vụ</strong><span>Tổng hợp tiến độ từ hệ thống</span></div></label></div>`,
    voice: `<div class="tool-single-form"><textarea placeholder="Dán nội dung cần đọc hoặc chọn tài liệu..."></textarea><label class="tool-option"><input type="checkbox" checked><div><strong>Giọng đọc tiếng Việt</strong><span>Bản A4 chỉ mô phỏng giao diện</span></div></label></div>`
  };

  const openToolModal = type => {
    toolModalTitle.textContent = toolTitles[type] || 'Công cụ';
    toolModalBody.innerHTML = toolBodies[type] || '';
    toolModal.classList.add('show');
    lucide.createIcons();
  };
  const closeToolModal = () => toolModal.classList.remove('show');

  document.querySelectorAll('.tool-launch').forEach(btn => btn.addEventListener('click', () => openToolModal(btn.dataset.tool)));
  document.querySelectorAll('.close-tool-modal').forEach(btn => btn.addEventListener('click', closeToolModal));
  toolModal?.addEventListener('click', e => { if (e.target === toolModal) closeToolModal(); });
  runToolAction?.addEventListener('click', () => {
    closeToolModal();
    showToast('Đã chạy thử công cụ', 'Bản A4 đang mô phỏng giao diện. Chức năng thật sẽ được nối sau.');
  });


  globalSearch?.addEventListener('keydown', e => {
    if (e.key === 'Enter' && globalSearch.value.trim()) {
      showToast('Tìm kiếm toàn hệ thống', `Đã nhận từ khóa: "${globalSearch.value.trim()}".`);
    }
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault(); globalSearch?.focus();
    }
    if (e.key === 'Escape') {
      quickMenu?.classList.remove('show');
      notificationPanel?.classList.remove('show');
      closeMobileSidebar();
      closeDrawer();
      closeModal();
      document.getElementById('toolModal')?.classList.remove('show');
    }
  });
});
</script>

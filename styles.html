<style>
:root{
  --red:#B91C1C;
  --red-dark:#991B1B;
  --red-soft:#FEF2F2;
  --bg:#F5F7FA;
  --card:#FFFFFF;
  --text:#1F2937;
  --muted:#6B7280;
  --line:#E5E7EB;
  --line-soft:#EEF1F4;
  --blue:#2563EB;
  --blue-soft:#EFF6FF;
  --green:#16A34A;
  --green-soft:#F0FDF4;
  --amber:#D97706;
  --amber-soft:#FFFBEB;
  --purple:#7C3AED;
  --purple-soft:#F5F3FF;
  --danger:#DC2626;
  --shadow:0 10px 30px rgba(15,23,42,.06);
  --shadow-lg:0 24px 60px rgba(15,23,42,.14);
  --radius:18px;
  --sidebar-w:264px;
  --sidebar-collapsed:84px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,input{font:inherit}
button{cursor:pointer}

.app-shell{min-height:100vh}

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:var(--sidebar-w);
  background:#fff;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  z-index:40;
  transition:width .25s ease, transform .25s ease;
}

.brand{
  height:82px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 18px;
  border-bottom:1px solid var(--line-soft);
}

.brand-mark{
  width:42px;
  height:42px;
  border-radius:14px;
  background:linear-gradient(145deg,#B91C1C,#7F1D1D);
  display:grid;
  place-items:center;
  box-shadow:0 8px 22px rgba(185,28,28,.22);
  flex:0 0 auto;
}

.star{color:#FDE68A;font-size:18px;line-height:1}
.brand-text{min-width:0;flex:1}
.brand-title{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--red-dark)}
.brand-subtitle{font-size:16px;font-weight:800;letter-spacing:.03em;margin-top:2px}
.sidebar-collapse{flex:0 0 auto}

.icon-btn{
  width:38px;
  height:38px;
  border:0;
  background:transparent;
  color:#64748B;
  display:grid;
  place-items:center;
  border-radius:11px;
  transition:.18s ease;
}
.icon-btn:hover{background:#F1F5F9;color:#111827}
.icon-btn svg{width:19px;height:19px}

.nav{
  padding:16px 12px;
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow:auto;
}

.nav-section-label{
  color:#94A3B8;
  font-size:10px;
  font-weight:800;
  letter-spacing:.14em;
  padding:16px 12px 8px;
}

.nav-item{
  min-height:46px;
  padding:0 12px;
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  border-radius:12px;
  color:#475569;
  font-size:14px;
  font-weight:600;
  position:relative;
  transition:.18s ease;
}

.nav-item:hover{background:#F8FAFC;color:#111827}
.nav-item.active{
  color:var(--red-dark);
  background:var(--red-soft);
}
.nav-item.active::before{
  content:'';
  position:absolute;
  left:-12px;
  width:4px;
  height:26px;
  border-radius:0 5px 5px 0;
  background:var(--red);
}
.nav-icon{
  width:22px;
  height:22px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
}
.nav-icon svg{width:20px;height:20px}
.nav-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-badge{
  margin-left:auto;
  min-width:22px;
  height:22px;
  border-radius:999px;
  display:grid;
  place-items:center;
  padding:0 6px;
  background:#EEF2FF;
  color:#4338CA;
  font-size:11px;
  font-weight:800;
}
.nav-badge.warning{background:#FFF7ED;color:#C2410C}

.sidebar-bottom{
  margin-top:auto;
  padding:8px 12px 14px;
  border-top:1px solid var(--line-soft);
}
.sidebar-user{
  margin-top:10px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#F8FAFC;
  border-radius:14px;
}
.sidebar-user-info{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
  flex:1;
}
.sidebar-user-info strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-info span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chevron{width:16px;height:16px;color:#94A3B8}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(145deg,#991B1B,#DC2626);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:800;
  box-shadow:0 6px 18px rgba(185,28,28,.18);
  flex:0 0 auto;
}
.avatar-sm{width:34px;height:34px;font-size:11px}

.main-shell{
  margin-left:var(--sidebar-w);
  min-height:100vh;
  transition:margin-left .25s ease;
}

.topbar{
  height:82px;
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
}

.topbar-left,.topbar-right{display:flex;align-items:center;gap:12px}

.global-search{
  height:44px;
  width:min(560px,42vw);
  background:#F8FAFC;
  border:1px solid #E2E8F0;
  border-radius:13px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  transition:.2s ease;
}
.global-search:focus-within{
  background:#fff;
  border-color:#CBD5E1;
  box-shadow:0 0 0 4px rgba(148,163,184,.12);
}
.global-search svg{width:18px;height:18px;color:#94A3B8}
.global-search input{
  border:0;
  outline:0;
  background:transparent;
  min-width:0;
  flex:1;
  color:#0F172A;
  font-size:13px;
}
.global-search input::placeholder{color:#94A3B8}
.shortcut{
  font-size:10px;
  color:#94A3B8;
  border:1px solid #E2E8F0;
  background:#fff;
  padding:4px 6px;
  border-radius:6px;
  white-space:nowrap;
}

.quick-create{
  height:40px;
  border:0;
  border-radius:11px;
  padding:0 14px;
  background:var(--red);
  color:#fff;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  font-size:13px;
  box-shadow:0 8px 20px rgba(185,28,28,.18);
}
.quick-create:hover{background:var(--red-dark)}
.quick-create svg{width:17px;height:17px}

.has-indicator{position:relative;background:#F8FAFC}
.indicator{
  position:absolute;
  width:8px;height:8px;
  border-radius:50%;
  background:#DC2626;
  border:2px solid #fff;
  right:8px;top:8px;
}

.profile-chip{
  height:46px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 10px 0 6px;
  border:1px solid transparent;
  border-radius:13px;
}
.profile-chip:hover{background:#F8FAFC;border-color:#E2E8F0}
.profile-chip svg{width:16px;height:16px;color:#94A3B8}
.profile-text{display:flex;flex-direction:column;gap:1px}
.profile-text strong{font-size:11px}
.profile-text span{font-size:10px;color:var(--muted)}
.mobile-menu{display:none}

.workspace{padding:28px}
.page{max-width:1540px;margin:0 auto}

.hero{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:24px;
  margin-bottom:22px;
}
.eyebrow{
  margin:0 0 7px;
  color:var(--red-dark);
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
}
.hero h1{
  margin:0;
  font-size:26px;
  line-height:1.3;
  letter-spacing:-.025em;
}
.hero-sub{
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
}
.text-danger{color:var(--danger);font-weight:700}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}

.btn{
  min-height:40px;
  padding:0 14px;
  border-radius:11px;
  border:1px solid transparent;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:700;
  font-size:13px;
  transition:.18s ease;
}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(185,28,28,.14)}
.btn-primary:hover{background:var(--red-dark);transform:translateY(-1px)}
.btn-secondary{background:#fff;color:#334155;border-color:#E2E8F0}
.btn-secondary:hover{background:#F8FAFC}
.btn-light{background:#F8FAFC;color:#334155;border-color:#E2E8F0}
.btn-light:hover{background:#F1F5F9}
.btn-sm{min-height:34px;font-size:12px;padding:0 12px}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}

.stat-card{
  min-height:126px;
  background:var(--card);
  border:1px solid #E5E7EB;
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:flex-start;
  gap:14px;
  position:relative;
  transition:.2s ease;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(15,23,42,.08)}
.danger-card{border-color:#FECACA}
.stat-icon{
  width:44px;height:44px;
  border-radius:14px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
}
.stat-icon svg{width:21px;height:21px}
.stat-icon.blue{background:var(--blue-soft);color:var(--blue)}
.stat-icon.green{background:var(--green-soft);color:var(--green)}
.stat-icon.amber{background:var(--amber-soft);color:var(--amber)}
.stat-icon.red{background:var(--red-soft);color:var(--danger)}
.stat-content{display:flex;flex-direction:column;min-width:0}
.stat-label{font-size:12px;color:#64748B;font-weight:600}
.stat-number{font-size:28px;line-height:1.15;margin-top:4px;letter-spacing:-.03em}
.stat-foot{font-size:10.5px;color:#94A3B8;margin-top:5px}
.stat-foot.positive{color:#15803D}
.warning-text{color:#B45309}
.danger-text{color:#B91C1C}
.stat-mini-link{
  position:absolute;
  right:14px;
  top:14px;
  display:flex;
  align-items:center;
  gap:3px;
  font-size:10px;
  color:#94A3B8;
  font-weight:700;
}
.stat-mini-link svg{width:13px;height:13px}

.dashboard-grid{
  display:grid;
  grid-template-columns:minmax(0,1.72fr) minmax(320px,.78fr);
  gap:18px;
  margin-bottom:18px;
}
.lower-grid{
  display:grid;
  grid-template-columns:minmax(0,1.72fr) minmax(320px,.78fr);
  gap:18px;
  margin-bottom:18px;
}

.panel{
  background:#fff;
  border:1px solid #E5E7EB;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.panel-head{
  min-height:72px;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  border-bottom:1px solid var(--line-soft);
}
.panel-head h2{margin:0;font-size:15px;letter-spacing:-.01em}
.panel-head p{margin:4px 0 0;color:#94A3B8;font-size:11px}

.segmented{
  display:flex;
  background:#F8FAFC;
  border:1px solid #E2E8F0;
  border-radius:10px;
  padding:3px;
}
.segment{
  border:0;
  background:transparent;
  color:#64748B;
  font-size:10px;
  font-weight:700;
  padding:6px 10px;
  border-radius:7px;
}
.segment.active{background:#fff;color:#111827;box-shadow:0 2px 8px rgba(15,23,42,.08)}

.task-list{padding:0 20px}
.task-row{
  min-height:84px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #F1F5F9;
}
.task-row:last-child{border-bottom:0}
.priority-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.priority-dot.high{background:#DC2626;box-shadow:0 0 0 5px #FEF2F2}
.priority-dot.medium{background:#F59E0B;box-shadow:0 0 0 5px #FFFBEB}
.priority-dot.normal{background:#2563EB;box-shadow:0 0 0 5px #EFF6FF}
.priority-dot.overdue{background:#7F1D1D;box-shadow:0 0 0 5px #FEF2F2}
.task-main{min-width:0;flex:1}
.task-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.task-title-row h3{font-size:12.5px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:7px;color:#94A3B8;font-size:9.8px}
.task-meta span{display:flex;align-items:center;gap:4px}
.task-meta svg{width:13px;height:13px}
.tag{background:#F8FAFC;color:#64748B;border:1px solid #E2E8F0;border-radius:999px;padding:3px 7px}

.status{
  display:inline-flex;
  align-items:center;
  white-space:nowrap;
  border-radius:999px;
  padding:5px 8px;
  font-size:9px;
  font-weight:800;
}
.status-progress{background:#EFF6FF;color:#1D4ED8}
.status-warning{background:#FFF7ED;color:#C2410C}
.status-new{background:#F8FAFC;color:#475569}
.status-danger{background:#FEF2F2;color:#B91C1C}
.row-action{width:32px;height:32px}
.panel-footer{
  min-height:54px;
  padding:0 20px;
  display:flex;
  align-items:center;
  border-top:1px solid var(--line-soft);
}
.text-btn{
  border:0;
  background:transparent;
  color:var(--red-dark);
  font-size:11px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.text-btn svg{width:14px;height:14px}

.agenda-list{padding:10px 20px}
.agenda-item{
  display:grid;
  grid-template-columns:46px 4px 1fr;
  gap:12px;
  min-height:66px;
  align-items:stretch;
}
.agenda-time{font-size:10px;color:#64748B;font-weight:700;padding-top:11px}
.agenda-line{width:3px;border-radius:999px;background:#CBD5E1;margin:8px 0}
.blue-line{background:#2563EB}
.red-line{background:#DC2626}
.amber-line{background:#F59E0B}
.agenda-content{
  padding:9px 0;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.agenda-content strong{font-size:11.5px;line-height:1.35}
.agenda-content span{
  color:#94A3B8;
  font-size:9.5px;
  display:flex;
  align-items:center;
  gap:4px;
}
.agenda-content svg{width:12px;height:12px}
.active-agenda .agenda-content{
  background:#FFF7F7;
  border:1px solid #FEE2E2;
  border-radius:12px;
  padding:9px 10px;
  margin:2px 0;
}
.full-soft-btn{
  width:calc(100% - 40px);
  margin:4px 20px 18px;
  min-height:38px;
  border:1px solid #E2E8F0;
  background:#F8FAFC;
  color:#475569;
  border-radius:10px;
  font-size:10.5px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}
.full-soft-btn svg{width:15px;height:15px}

.document-list{padding:0 20px}
.document-row{
  min-height:86px;
  display:flex;
  align-items:center;
  gap:13px;
  border-bottom:1px solid #F1F5F9;
}
.document-row:last-child{border-bottom:0}
.doc-icon{
  width:40px;height:40px;
  border-radius:12px;
  background:#FEF2F2;
  color:#B91C1C;
  display:grid;
  place-items:center;
  flex:0 0 auto;
}
.doc-icon.purple{background:#F5F3FF;color:#7C3AED}
.doc-icon.green-doc{background:#F0FDF4;color:#15803D}
.doc-icon svg{width:19px;height:19px}
.doc-main{min-width:0;flex:1}
.doc-top{display:flex;align-items:center;gap:7px}
.doc-top strong{font-size:10px;color:#475569}
.new-badge{font-size:8px;font-weight:800;background:#FEF2F2;color:#B91C1C;border-radius:999px;padding:3px 6px}
.doc-main h3{font-size:11.5px;margin:5px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font-size:9.5px;color:#94A3B8}

.progress-panel{padding-bottom:16px}
.donut-wrap{display:grid;place-items:center;padding:20px 0 14px}
.donut{
  width:148px;height:148px;
  border-radius:50%;
  background:conic-gradient(#16A34A calc(var(--value)*1%), #E2E8F0 0);
  position:relative;
  display:grid;
  place-items:center;
}
.donut::after{
  content:'';
  position:absolute;
  inset:13px;
  border-radius:50%;
  background:#fff;
}
.donut-center{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.donut-center strong{font-size:24px}
.donut-center span{font-size:9px;color:#94A3B8;margin-top:3px}
.legend{padding:0 22px}
.legend>div{
  display:grid;
  grid-template-columns:10px 1fr auto;
  gap:8px;
  align-items:center;
  min-height:30px;
  font-size:10px;
  color:#64748B;
}
.legend strong{color:#0F172A}
.legend-dot{width:8px;height:8px;border-radius:50%}
.legend-dot.done{background:#16A34A}
.legend-dot.doing{background:#2563EB}
.legend-dot.overdue{background:#DC2626}

.quick-tools{margin-bottom:24px}
.tool-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
  padding:18px 20px 20px;
}
.tool-card{
  min-height:78px;
  background:#fff;
  border:1px solid #E5E7EB;
  border-radius:14px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  text-align:left;
  transition:.18s ease;
}
.tool-card:hover{transform:translateY(-2px);border-color:#CBD5E1;box-shadow:0 10px 24px rgba(15,23,42,.07)}
.tool-icon{
  width:40px;height:40px;
  border-radius:12px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
}
.tool-icon svg{width:19px;height:19px}
.red-soft{background:#FEF2F2;color:#B91C1C}
.blue-soft{background:#EFF6FF;color:#2563EB}
.purple-soft{background:#F5F3FF;color:#7C3AED}
.amber-soft{background:#FFFBEB;color:#D97706}
.green-soft{background:#F0FDF4;color:#16A34A}
.tool-card span:last-child{display:flex;flex-direction:column;min-width:0}
.tool-card strong{font-size:10.5px}
.tool-card small{font-size:8.8px;color:#94A3B8;margin-top:4px;line-height:1.35}

.floating-menu{
  position:fixed;
  right:118px;
  top:74px;
  width:220px;
  background:#fff;
  border:1px solid #E2E8F0;
  border-radius:14px;
  box-shadow:var(--shadow-lg);
  z-index:60;
  padding:8px;
  opacity:0;
  transform:translateY(-8px) scale(.98);
  pointer-events:none;
  transition:.18s ease;
}
.floating-menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.floating-title{font-size:10px;font-weight:800;color:#94A3B8;padding:8px 10px 6px;text-transform:uppercase;letter-spacing:.08em}
.floating-menu button{
  width:100%;
  min-height:38px;
  border:0;
  background:transparent;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:9px;
  color:#334155;
  font-size:11px;
  font-weight:600;
  padding:0 10px;
}
.floating-menu button:hover{background:#F8FAFC}
.floating-menu button svg{width:16px;height:16px;color:#64748B}

.notification-panel{
  position:fixed;
  right:20px;
  top:74px;
  width:360px;
  max-height:520px;
  background:#fff;
  border:1px solid #E2E8F0;
  border-radius:16px;
  box-shadow:var(--shadow-lg);
  z-index:70;
  opacity:0;
  transform:translateY(-8px) scale(.98);
  pointer-events:none;
  transition:.18s ease;
  overflow:hidden;
}
.notification-panel.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.notif-head{
  min-height:64px;
  padding:0 14px 0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line-soft);
}
.notif-head>div{display:flex;flex-direction:column;gap:3px}
.notif-head strong{font-size:13px}

   ========================= */
.backend-banner{
